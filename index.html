<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WED/PLAN">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>WED/PLAN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700&family=VT323&display=swap">
<style>
/* Layout: one phone-width column. Sticky HUD, pixel scene under it, cards below, tab bar fixed at the bottom during prep. */
:root {
  --bg: #fbf1f2;
  --surface: #ffffff;
  --surface-2: #f6e6ea;
  --ink: #2b1f33;
  --muted: #7c6b80;
  --line: #ead7dd;
  --rose: #d9577a;
  --on-rose: #ffffff;
  --jade: #23806c;
  --jade-soft: #dff1ec;
  --gold: #9a6a12;
  --gold-soft: #fbefd2;
  --danger: #c43d32;
  --danger-soft: #fbe3e0;
  --desk: #efe0e4;
  --pixel: "VT323", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --nav-h: 132px;
  color-scheme: light; /* Nền tối đã bỏ (Thanh, 11/11/2026): game luôn sáng, kể cả khi máy bật chế độ tối */
}
* { box-sizing: border-box; }
/* Nền đứng yên (Thanh, 11/11/2026): trang chỉ cuộn khi nội dung dài hơn màn hình.
   overscroll-behavior tắt kiểu "kéo nảy" của iPhone; 100dvh bên dưới là chiều cao phần màn hình thật sự nhìn thấy
   (100vh trên Safari iPhone cao hơn màn hình, nên màn nào cũng kéo được một đoạn). */
html { background: var(--desk); overscroll-behavior: none; }
body { margin: 0; overscroll-behavior: none; background: var(--desk); color: var(--ink); font: 15px/1.5 var(--body); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }
img.sprite { image-rendering: pixelated; image-rendering: crisp-edges; display: block; flex: none; }
.neg { color: var(--danger); }
.pos { color: var(--jade); }
.muted { color: var(--muted); }
.center { text-align: center; }

#app { max-width: 460px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; background: var(--bg); position: relative; box-shadow: 0 0 0 1px var(--line); }

/* HUD */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 2px solid var(--ink); }
.hud-in { display: flex; align-items: center; gap: 10px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hud-who { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.hud-who b { display: block; font: 24px/1 var(--pixel); }
.hud-who small { color: var(--muted); font-size: 12px; }
.hud-face { width: 40px; height: auto; }
.pips { display: flex; gap: 4px; }
.pips i { width: 12px; height: 12px; border: 2px solid var(--ink); background: transparent; }
.pips i.on { background: var(--rose); }
.hud-right { display: flex; align-items: center; gap: 8px; }
.coin { font: 20px/1 var(--pixel); background: var(--gold-soft); color: var(--gold); padding: 4px 8px; border: 2px solid currentColor; white-space: nowrap; }
.coin.neg { background: var(--danger-soft); color: var(--danger); }
.icon-btn { width: 40px; height: 40px; border: 2px solid var(--ink); background: var(--surface); font-size: 20px; line-height: 1; }

/* Scene */
.stage { background: var(--ink); border-bottom: 2px solid var(--ink); }
.stage canvas { display: block; width: 100%; height: auto; aspect-ratio: 192 / 120; image-rendering: pixelated; image-rendering: crisp-edges; max-width: 100%; }

/* Main */
.main { padding-block: 16px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.main.with-nav { padding-bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.h { font: 26px/1.05 var(--pixel); margin: 0; letter-spacing: .01em; text-wrap: balance; }
.h.big { font-size: 34px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card { background: var(--surface); border: 2px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card.slim { padding: 10px 12px; gap: 2px; }
.card.center { align-items: center; text-align: center; }
.card p { margin: 0; }
.row-between { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.hint, .week-note { margin: 0; color: var(--muted); font-size: 14px; }
.empty { color: var(--muted); text-align: center; margin: 8px 0; }

/* Buttons */
.btn { min-height: 48px; padding: 10px 16px; border: 2px solid var(--ink); background: var(--surface); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 3px 3px 0 var(--ink); }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.btn.primary { background: var(--rose); color: var(--on-rose); }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font-size: 12px; padding: 2px 8px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.chips span.neg { background: var(--danger-soft); color: var(--danger); }
.chips span.pos { background: var(--jade-soft); color: var(--jade); }
.chips span.gold { background: var(--gold-soft); color: var(--gold); }

/* Title */
.title-card { display: flex; flex-direction: column; gap: 12px; }
.logo { font: 64px/0.9 var(--pixel); margin: 4px 0 0; letter-spacing: .02em; }
.logo span { color: var(--rose); }
.lede { margin: 0; max-width: 36ch; }
.pick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pick { background: var(--surface); border: 2px solid var(--line); padding: 12px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.pick:hover { border-color: var(--rose); }
.pick b { font: 26px/1 var(--pixel); }
.pick small { color: var(--muted); font-size: 12px; line-height: 1.35; }
.tag { font-size: 12px; font-weight: 700; background: var(--rose); color: var(--on-rose); padding: 1px 8px; }
img.big { width: 72px; height: auto; }

/* Brief chat */
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.facts span { background: var(--surface); border: 2px solid var(--line); padding: 8px; display: flex; flex-direction: column; min-width: 0; }
.facts small { color: var(--muted); font-size: 11px; }
.facts b { font: 22px/1 var(--pixel); }
.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { display: flex; gap: 8px; align-items: flex-end; }
/* Khách và gia đình bên trái, planner bên phải (sửa 3.7.0, mục 1.12). */
.msg.me { flex-direction: row-reverse; }
.msg p { margin: 0; background: var(--surface); border: 2px solid var(--ink); padding: 10px 12px; max-width: 80%; position: relative; }
.msg.groom p { background: var(--surface-2); }
.msg.me p { background: var(--surface-2); border-style: dashed; }
.msg.solo p { max-width: none; text-align: left; }
img.face { width: 40px; height: auto; }

/* Quote */
.rows { margin: 0; display: flex; flex-direction: column; }
.rows div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.rows dt { color: var(--muted); }
.rows dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rows .sum { border-bottom: 0; border-top: 2px solid var(--ink); }
.rows .sum dt { color: var(--ink); font-weight: 700; }
.tier { text-align: left; background: var(--surface); border: 2px solid var(--ink); padding: 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: 3px 3px 0 var(--ink); }
.tier:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.tier p { margin: 0; color: var(--muted); font-size: 14px; }
.tier-top { display: flex; justify-content: space-between; align-items: baseline; }
.tier-top b { font-size: 17px; }
.big-num { font: 32px/1 var(--pixel); color: var(--rose); }

/* Prep lists */
.list { display: flex; flex-direction: column; gap: 8px; }
.banner { text-align: left; border: 2px solid var(--gold); background: var(--gold-soft); color: var(--ink); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.banner span { font-size: 13px; color: var(--muted); }
.task { text-align: left; background: var(--surface); border: 2px solid var(--line); padding: 12px; display: flex; gap: 10px; align-items: flex-start; }
.task:hover { border-color: var(--rose); }
.task-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.task-main small { color: var(--muted); font-size: 13px; line-height: 1.4; }
.task em, .opt em { font-style: normal; font-size: 12px; color: var(--danger); }
.task.locked { opacity: .6; }
.cost { color: var(--rose); letter-spacing: 2px; font-size: 14px; }
.done { color: var(--muted); font-size: 14px; }
.done ul { margin: 6px 0 0; padding-left: 18px; }
.cats { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cat { flex: none; border: 2px solid var(--line); background: var(--surface); padding: 6px 10px; display: flex; align-items: center; gap: 6px; font-size: 14px; }
.cat i { font-style: normal; font-size: 11px; color: var(--muted); }
.cat.on { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.cat.on i { color: var(--bg); }
.vrow { text-align: left; background: var(--surface); border: 2px solid var(--line); padding: 10px; display: flex; gap: 10px; align-items: center; }
.vrow.sel { border-color: var(--jade); }
.vrow-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.vrow-main small { color: var(--muted); font-size: 12px; }
.vrow-num { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
.vrow-num b { font: 24px/1 var(--pixel); }
.vrow-num small { font-size: 12px; font-weight: 700; }
.badge { font-size: 11px; background: var(--jade); color: var(--surface); padding: 0 6px; margin-top: 2px; }
.stars { color: var(--gold); letter-spacing: 1px; font-size: 13px; }
.stars i { font-style: normal; color: var(--line); }
.risks { display: flex; flex-direction: column; gap: 6px; }
.risk { display: grid; grid-template-columns: 1fr 70px 42px; align-items: center; gap: 8px; font-size: 14px; }
.risk b { text-align: right; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--surface-2); }
.bar i { display: block; height: 100%; background: var(--jade); }
.bar i.warm { background: var(--gold); }
.bar i.hot { background: var(--danger); }
.bul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.checks li { color: var(--muted); }
.checks li.ok { color: var(--jade); }
.checks small { color: var(--muted); }

/* Event */
.crisis { border-color: var(--ink); }
.why summary, details.card summary { cursor: pointer; font-weight: 700; }
.why ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
.opt { text-align: left; background: var(--surface); border: 2px solid var(--ink); padding: 12px; display: flex; flex-direction: column; gap: 6px; box-shadow: 3px 3px 0 var(--ink); }
.opt:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.opt small { color: var(--muted); }
.opt.locked { border-color: var(--line); box-shadow: none; opacity: .7; }
.opt.on { background: var(--surface-2); border-color: var(--rose); }
.outcome { border-color: var(--jade); }
.outcome.absorb { border-color: var(--danger); }
.outcome.client { border-color: var(--gold); }
.outcome h3 { margin: 0; font-size: 17px; }

/* Review */
.stars-big { font-size: 40px; color: var(--gold); letter-spacing: 4px; line-height: 1; }
.stars-big i { font-style: normal; color: var(--line); }
.score3 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.score3 div { background: var(--surface); border: 2px solid var(--line); padding: 10px; display: flex; flex-direction: column; }
.score3 small { color: var(--muted); font-size: 12px; }
.score3 b { font: 32px/1 var(--pixel); }
.score3 .total { grid-column: 1 / -1; border-color: var(--ink); background: var(--gold-soft); }
.score3 .total b { font-size: 44px; color: var(--gold); }

/* Bottom nav */
.nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(460px, 100%); z-index: 20; background: var(--surface); border-top: 2px solid var(--ink); }
.nav-in { padding-top: 10px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; }
.next { width: 100%; }
.muted-on { font-weight: 400; font-size: 13px; opacity: .85; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { background: none; border: 0; padding: 4px 0; display: flex; flex-direction: column; align-items: center; font-size: 12px; color: var(--muted); min-height: 44px; }
.tab span { font-size: 18px; line-height: 1.1; }
.tab.on { color: var(--rose); font-weight: 700; }

/* Bottom sheet */
#sheet .backdrop { position: fixed; inset: 0; background: rgba(28, 21, 36, .5); z-index: 40; }
.sheet { position: fixed; z-index: 41; left: 50%; bottom: 0; transform: translateX(-50%); width: min(460px, 100%); max-height: 86vh; overflow-y: auto; background: var(--bg); border-top: 2px solid var(--ink); padding-top: 18px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; animation: up .18s ease-out; }
@keyframes up { from { transform: translate(-50%, 24px); opacity: .6; } }
.sheet p { margin: 0; }
.sheet-x { position: absolute; top: 8px; right: max(12px, env(safe-area-inset-right, 0px)); width: 40px; height: 40px; border: 0; background: none; font-size: 26px; color: var(--muted); }
.sheet-head { display: flex; gap: 12px; align-items: center; padding-right: 36px; }
.sheet-actions { display: flex; flex-direction: column; gap: 8px; }
.quote { font-style: italic; color: var(--muted); }
.note { font-size: 14px; color: var(--muted); }
.specs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.spec { border: 2px solid var(--line); background: var(--surface); padding: 8px 6px; display: flex; flex-direction: column; gap: 1px; text-align: left; font-size: 13px; min-width: 0; }
.spec b { font-size: 14px; }
.spec small { color: var(--muted); font-size: 11px; }
.spec.on { border-color: var(--ink); background: var(--surface-2); }
.log { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.log li { border-left: 3px solid var(--line); padding-left: 8px; }
.log li.good { border-color: var(--jade); }
.log li.bad { border-color: var(--danger); }
.log small { color: var(--muted); margin-right: 6px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: var(--bg); padding: 8px 14px; font-size: 14px; max-width: min(420px, 90%); }
.toast.warn { background: var(--danger); color: #fff; }
.toast.good { background: var(--jade); color: var(--surface); }

@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .btn:active, .opt:active, .tier:active { transform: none; } }
.hud-who b, .coin { white-space: nowrap; }
.facts b { font-size: 21px; overflow-wrap: anywhere; }
#main:not(.with-nav) ~ .toast { bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }

/* v2.1: time, meetings, wishes, outcomes */
button.pips { background: none; border: 0; padding: 6px 2px; flex-wrap: wrap; max-width: 92px; }
.small { font-size: 12px; }
.time { gap: 8px; }
.time-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.mini { border: 2px solid var(--ink); background: var(--surface); padding: 6px 8px; font-size: 13px; font-weight: 700; min-height: 40px; }
.mini.primary { background: var(--rose); color: var(--on-rose); }
.mini:disabled { opacity: .45; cursor: not-allowed; }
.banner.rose { border-color: var(--rose); background: var(--surface-2); }
.task.meet { border-color: var(--rose); }
.vrow.full { opacity: .5; }
.badge.warn { background: var(--gold); }
.wish { display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 2px dashed var(--rose); background: var(--surface-2); }
.wish > div { display: flex; flex-direction: column; gap: 4px; }
.wish small { color: var(--muted); }
.wish em { font-style: normal; font-size: 12px; color: var(--muted); }
.wish.done { border-style: solid; border-color: var(--jade); background: var(--jade-soft); }
.wish.taboo { border-color: var(--gold); background: var(--gold-soft); }
.wish.taboo.broken { border-color: var(--danger); background: var(--danger-soft); }
.wish > span { font-weight: 700; font-size: 13px; }
.wish small.tag-coord { align-self: flex-start; padding: 1px 6px; border: 1px solid var(--jade); color: var(--ink); background: var(--jade-soft); font-size: 11px; font-weight: 700; }
.unlock { align-self: center; font-size: 13px; font-weight: 700; padding: 4px 10px; background: var(--jade-soft); color: var(--jade); border: 2px solid currentColor; }
.unlock.taboo { background: var(--gold-soft); color: var(--gold); }
.unlock.info { background: var(--surface); color: var(--ink); }
.msg.groom-l p { background: var(--surface-2); }
.mark { margin: 0; font-size: 14px; padding: 8px 10px; background: var(--gold-soft); color: var(--ink); border-left: 4px solid var(--gold); }
.moment { border-color: var(--jade); }
.moment.bad { border-color: var(--danger); }
.outcome.good { border-color: var(--jade); }
.outcome.ok { border-color: var(--jade); }
.outcome.fail { border-color: var(--gold); }
.outcome.bad { border-color: var(--danger); }

/* v2.2: one-screen week */
:root { --nav-h: 76px; }
.hud .status { display: grid; grid-template-columns: 1fr 1.3fr 1.3fr; gap: 6px; padding-bottom: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stat { border: 2px solid var(--ink); background: var(--surface); padding: 4px 8px; text-align: left; display: flex; flex-direction: column; min-width: 0; }
.stat small { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat b { font: 24px/1 var(--pixel); }
.stat b i { font-style: normal; font-size: 16px; color: var(--muted); }
.stat.gold b { color: var(--gold); }
.stat.neg b { color: var(--danger); }
.stat.cool b { color: var(--jade); }
.stat.warm b { color: var(--gold); }
.stat.hot b { color: var(--danger); }
.coin { cursor: pointer; }
.sec { font: 24px/1 var(--pixel); margin: 6px 0 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.link { background: none; border: 0; padding: 4px 0; color: var(--rose); font: 700 13px/1.2 var(--body); text-decoration: underline; text-underline-offset: 3px; }
.pick-cat { gap: 6px; }
.vopt, .vsel { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px dashed var(--line); }
.vsel { border-top: 0; }
.vopt.full { opacity: .5; }
.vopt-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.vopt-main b { font-size: 14px; line-height: 1.25; }
.vopt-num { display: flex; flex-direction: column; align-items: flex-end; }
.vopt-num b { font: 22px/1 var(--pixel); }
.vopt-num small { font-size: 12px; font-weight: 700; white-space: nowrap; }
.rel { font-size: 12px; font-weight: 700; }
.rel.r5, .rel.r4 { color: var(--jade); }
.rel.r3 { color: var(--gold); }
.rel.r2, .rel.r1 { color: var(--danger); }
.booked { gap: 6px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 2px solid var(--ink); }
.seg button { border: 0; border-left: 2px solid var(--ink); background: var(--surface); padding: 6px 4px; display: flex; flex-direction: column; align-items: center; font-size: 12px; min-height: 44px; }
.seg button:first-child { border-left: 0; }
.seg button b { font-size: 13px; }
.seg button.on { background: var(--ink); color: var(--bg); }
.seg button.on .pos, .seg button.on .neg { color: inherit; }
.pill { font-size: 12px; font-weight: 700; padding: 2px 8px; white-space: nowrap; }
.pill.cool { background: var(--jade-soft); color: var(--jade); }
.pill.warm { background: var(--gold-soft); color: var(--gold); }
.pill.hot { background: var(--danger-soft); color: var(--danger); }
.helps { color: var(--jade) !important; font-weight: 700; }
.risk-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.risk-row > div { display: flex; flex-direction: column; min-width: 0; }
.risk-row small { font-size: 12px; }
.booked-wrap > summary { cursor: pointer; list-style: none; }
.booked-wrap > summary::before { content: "▸ "; }
.booked-wrap[open] > summary::before { content: "▾ "; }
.booked-wrap .list { margin-top: 8px; }

/* ---- v3 career hub ---- */
.career-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.career-stats div { background: var(--surface); border: 2px solid var(--line); padding: 8px 10px; display: flex; flex-direction: column; min-width: 0; }
.career-stats small { color: var(--muted); font-size: 11px; }
.career-stats b { font: 26px/1 var(--pixel); overflow-wrap: anywhere; }
.career-stats b.neg, .neg { color: var(--danger); }
.goal { display: flex; flex-direction: column; gap: 4px; background: var(--surface-2); padding: 8px 10px; }
.goal > div { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 14px; }
.goal > div.ok { color: var(--jade); }
.goal b { font-variant-numeric: tabular-nums; }
.offer { border-color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }
.offer .big-num { font-size: 28px; }
.trait { background: var(--gold-soft); color: var(--gold); padding: 4px 8px; }
.staff { display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 10px; }
.staff small { display: block; color: var(--muted); font-size: 12px; }
.staff .face { width: 36px; height: auto; }
.hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.hist li { display: grid; grid-template-columns: 1fr auto 64px; gap: 8px; }
.hist li span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.hist b { color: var(--gold); }
.note { margin: 0; font-size: 13px; color: var(--danger); }
.pos { color: var(--jade); }
.card .btn { align-self: stretch; }

/* ---- v3.2 setup ---- */
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; font-size: 12px; }
.steps li { border-top: 4px solid var(--line); padding-top: 4px; color: var(--muted); }
.steps li.done { border-color: var(--jade); }
.steps li.on { border-color: var(--rose); color: var(--ink); font-weight: 700; }
.look-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.look { background: var(--surface); border: 2px solid var(--line); padding: 10px 0; display: flex; justify-content: center; }
.look.on { border-color: var(--rose); background: var(--surface-2); box-shadow: 3px 3px 0 var(--ink); }
.field { display: flex; flex-direction: column; gap: 4px; }
.field span { font-size: 13px; font-weight: 700; color: var(--muted); }
.field input { font: 24px/1.2 var(--pixel); padding: 10px 12px; border: 2px solid var(--ink); background: var(--surface); color: var(--ink); border-radius: 0; width: 100%; box-sizing: border-box; }
.field input:focus { outline: 3px solid var(--rose); outline-offset: 1px; }
.row-btns { display: flex; gap: 8px; }
.row-btns .btn { flex: 1; }
.btn:disabled { opacity: .45; }

/* ---- v3.3 budget range + 3 tiers ---- */
.cat-row { display: grid; grid-template-columns: 1fr auto auto; grid-template-areas: "name right chev" "range range chev"; align-items: center; gap: 2px 8px; width: 100%; text-align: left; background: none; border: 0; padding: 0; color: var(--ink); }
.cat-row .c-name { grid-area: name; font-weight: 700; }
.cat-row .c-range { grid-area: range; font: 20px/1 var(--pixel); color: var(--gold); }
.cat-row .small { grid-area: right; white-space: nowrap; }
.cat-row .chev { grid-area: chev; font-size: 18px; color: var(--muted); }
.tier-opt { display: grid; grid-template-columns: 40px 1fr auto; grid-template-areas: "label label label" "face main num"; gap: 2px 10px; align-items: center; text-align: left; width: 100%;
  background: var(--surface); border: 2px solid var(--ink); padding: 8px 10px; box-shadow: 3px 3px 0 var(--ink); color: var(--ink); }
.tier-opt:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.tier-opt:disabled { opacity: 1; border-color: var(--line); box-shadow: none; }
.tier-opt:disabled:not(.on) { opacity: .5; }
.tier-opt.on { border-color: var(--jade); background: var(--jade-soft); }
.tier-opt .t-name { grid-area: label; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--rose); }
.tier-opt img { grid-area: face; }
.tier-opt .t-main { grid-area: main; display: flex; flex-direction: column; min-width: 0; }
.tier-opt .t-main b { font-size: 14px; line-height: 1.25; }
.tier-opt .t-main small { font-size: 12px; }
.tier-opt .warn { color: var(--danger); font-weight: 700; }
.tier-opt .t-num { grid-area: num; display: flex; flex-direction: column; align-items: flex-end; }
.tier-opt .t-num b { font: 24px/1 var(--pixel); }
.tier-opt .t-num small { font-size: 12px; font-weight: 700; white-space: nowrap; }
.fee-range { display: flex; flex-direction: column; align-items: flex-end; }
.fee-range small { font-size: 11px; color: var(--muted); }
.fee-range b { font: 26px/1 var(--pixel); color: var(--rose); white-space: nowrap; }
.opt.fee-opt .big-num { font-size: 28px; }

/* ---- v3.5 UX pass ---- */
.stage.compact canvas { aspect-ratio: auto; height: 150px; object-fit: cover; object-position: 50% 82%; }
.toast { top: calc(env(safe-area-inset-top, 0px) + 72px); bottom: auto; }
.week-card { border-color: var(--ink); gap: 6px; }
.week-card .h { font-size: 24px; }
.ap-pips { font-size: 14px; letter-spacing: 2px; color: var(--rose); white-space: nowrap; }
.decision { border: 2px solid var(--rose); background: var(--surface); gap: 8px; }
.decision.done { border-color: var(--jade); background: var(--jade-soft); gap: 4px; }
.decision.done p { font-size: 14px; }
.decision .opt { box-shadow: none; border-width: 1px; }
.decision .opt:disabled { opacity: .5; }
.grp { display: flex; flex-direction: column; gap: 8px; }
.grp-head { display: flex; justify-content: space-between; align-items: center; width: 100%; background: none; border: 0; border-top: 2px solid var(--ink); padding: 10px 0 2px; color: var(--ink); font: 26px/1 var(--pixel); text-align: left; }
.grp-head .muted { font: 600 13px var(--body); }
.grp-body { display: flex; flex-direction: column; gap: 8px; }
h3.sub { margin: 6px 0 0; font: 700 12px/1.3 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.list.lite .task { border-width: 1px; padding: 10px; }
.wish-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.wish-btns .mini { display: flex; flex-direction: column; align-items: flex-start; text-align: left; padding: 8px; gap: 2px; height: auto; }
.wish-btns .mini small { font-size: 11px; font-weight: 400; line-height: 1.3; color: inherit; opacity: .85; }
.ev-feed { gap: 10px; }
.ev-head { display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
.ev-item { gap: 6px; }
.ev-item p { font-size: 14px; }
.card.crisis .ask { margin-top: 4px; }
.ev-end { border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); }
#ev-cur { scroll-margin-top: 80px; }
.reasons { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.reasons li { display: grid; grid-template-columns: 40px 1fr; gap: 8px; align-items: baseline; font-size: 14px; }
.reasons li b { font: 22px/1 var(--pixel); text-align: right; }
.reasons li.pos b { color: var(--jade); }
.reasons li.neg b { color: var(--danger); }
.offer { box-shadow: none; border-width: 2px; gap: 6px; }
.offer-name { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; min-width: 0; }
.fit { font-size: 11px; font-weight: 700; padding: 1px 8px; background: var(--jade-soft); color: var(--jade); }
.offer-line { margin: 0; font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.offer-line span { font-size: 12px; padding: 1px 8px; background: var(--surface-2); }
.offer-line span.pos { background: var(--jade-soft); color: var(--jade); }
.offer-line span.gold { background: var(--gold-soft); color: var(--gold); }
.offer-sum { margin: 0; font-size: 14px; color: var(--muted); }
.card .row-btns .btn { align-self: auto; }

/* ---- v3.5.1 ---- */
.stage.compact canvas { height: 104px; object-position: 50% 86%; }
.toast { top: calc(env(safe-area-inset-top, 0px) + 10px); bottom: auto; box-shadow: 3px 3px 0 rgba(0,0,0,.25); }
.week-card { gap: 6px; padding-block: 10px; }
.week-goal { font: 22px/1.1 var(--pixel); }
.bar.thin { height: 6px; }
.week-more { display: flex; justify-content: space-between; gap: 8px; width: 100%; background: none; border: 0; padding: 0; color: var(--muted); font: 600 12px/1.4 var(--body); text-align: left; }
.week-more span:last-child { white-space: nowrap; color: var(--rose); }
.decision { gap: 6px; padding-block: 10px; }
.decision .h { font-size: 24px; }
.decision .msg p { font-size: 14px; }
.decision .opt { padding: 8px 10px; gap: 2px; }
.decision.flash { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
.decision.flash .eyebrow { color: var(--danger); }
.ev-done summary { display: flex; justify-content: space-between; align-items: center; gap: 8px; cursor: pointer; list-style: none; }
.ev-done summary::-webkit-details-marker { display: none; }
.ev-sum { display: flex; flex-direction: column; min-width: 0; }
.ev-done[open] summary { margin-bottom: 4px; }
.goal .bar { margin-block: 2px 4px; }
#hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
#hud .hud { position: static; }
#decision, #ev-cur { scroll-margin-top: 140px; }
.nudge { animation: nudge .45s ease; outline: 2px solid var(--danger); outline-offset: 2px; }
.nudge em { color: var(--danger); font-weight: 700; }
@keyframes nudge { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@media (prefers-reduced-motion: reduce) { .nudge { animation: none; } }

/* ---- v3.5.1 story-first prep ---- */
.pips { background: none; border: 0; padding: 0; color: var(--rose); font-size: 15px; letter-spacing: 2px; display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
.pips small { font: 600 11px var(--body); letter-spacing: 0; color: var(--muted); }
.need { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--surface-2); border: 0; border-top: 1px solid var(--line); color: var(--ink); font: 600 14px/1.35 var(--body);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.need img.face { width: 32px; }
.need-mark { width: 32px; height: 26px; display: grid; place-items: center; background: var(--danger); color: #fff; font: 22px/1 var(--pixel); }
.need .chev { color: var(--muted); font-size: 18px; }
.week-strip { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.week-strip .small { font-size: 12px; font-weight: 600; color: var(--muted); }
.speaker { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: start; }
.speaker b { font: 22px/1 var(--pixel); }
.speaker p { margin: 2px 0 0; font-size: 15px; line-height: 1.45; }
.decision .opt small { font-size: 13px; line-height: 1.4; color: var(--muted); }
.decision .opt em, .why-not { font-style: normal; font-size: 12px; color: var(--danger); }
.link.nums { font-size: 12px; white-space: nowrap; }
.v-slot { gap: 8px; }
.v-tabs { display: grid; grid-template-columns: repeat(3, 1fr); border: 2px solid var(--ink); }
.v-tabs button { background: var(--surface); border: 0; border-right: 2px solid var(--ink); padding: 8px 4px; font: 600 13px var(--body); color: var(--ink); }
.v-tabs button:last-child { border-right: 0; }
.v-tabs button.on { background: var(--ink); color: var(--bg); }
.v-card { display: flex; flex-direction: column; gap: 8px; }
.v-head { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; }
.v-head b { display: block; font-size: 16px; }
.v-head small { color: var(--muted); font-size: 12px; line-height: 1.35; }
.v-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; color: var(--muted); }
.v-bars > span { display: flex; flex-direction: column; gap: 3px; }
.bar5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; height: 8px; }
.bar5 i { background: var(--surface-2); border: 1px solid var(--line); }
.bar5 i.on { background: var(--jade); border-color: var(--jade); }
.v-nums { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.v-nums > span { display: flex; flex-direction: column; min-width: 0; }
.v-nums small { font-size: 11px; color: var(--muted); }
.v-nums b { font: 26px/1 var(--pixel); }
.v-nums b.gold { color: var(--gold); }
.v-note { margin: 0; font-size: 13px; line-height: 1.45; }
.task-done { padding: 8px 12px; background: var(--jade-soft); color: var(--jade); font-weight: 600; font-size: 14px; }
.link.block { display: block; text-align: left; padding: 4px 0; }
.book-open { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 2px solid var(--line); padding: 12px; color: var(--ink); }
.book-open b { font: 24px/1 var(--pixel); }
.book-open span { font-size: 13px; color: var(--muted); min-width: 0; }
.people { display: flex; flex-direction: column; gap: 8px; }
.person { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; }
.person p { margin: 0; font-size: 14px; line-height: 1.4; }
.chips span.pos, .chips span.neg { white-space: normal; }
.need-mark.soft { background: var(--gold-soft); color: var(--gold); }

/* ---- Cat cast ---- */
.fw { position: relative; display: inline-block; flex: none; line-height: 0; }
.fw::after { content: "!"; position: absolute; top: -7px; right: -7px; min-width: 16px; height: 16px; padding: 0 3px; font: 16px/14px var(--pixel); text-align: center; color: #fff; background: var(--danger); border: 2px solid var(--ink); }
.fw.upset::after { content: "…"; color: var(--ink); background: var(--surface); line-height: 8px; }

/* ---- Cảnh gặp gỡ (quán cà phê…) ---- */
/* Dải cảnh cao hơn để nhận ra nơi chốn (thấy quầy, cửa kính, bàn). Nhãn địa điểm là một dải chữ ngay dưới cảnh, không đè lên hình. Chỉ bật khi có người để gặp. */
.stage { position: relative; }
.stage.compact.meet canvas { height: 170px; object-position: 50% 67%; }
.place { display: block; padding: 2px 16px 3px; font: 17px/1.25 var(--pixel); color: var(--bg); background: var(--ink); }
.place[hidden] { display: none; }

/* ---- Cảnh luôn đứng yên (Thanh, 11/11/2026) ---- */
/* HUD và cảnh nằm chung một khối dính trên đầu ở mọi màn; chỉ phần nội dung bên dưới cuộn. */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
.top #hud, .top .hud { position: static; }
/* màn hình thấp: cảnh to (ngày cưới) thu lại theo đúng tỷ lệ, không cắt, để còn chỗ cho nội dung */
.top .stage:not(.compact) canvas { max-height: 42vh; max-height: 42dvh; object-fit: contain; }
#decision, #ev-cur { scroll-margin-top: calc(var(--top-h, 140px) + 12px); }

/* ---- Màn văn phòng gọn ---- */
.hubline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; width: 100%; text-align: left; padding: 10px 12px; background: var(--surface); border: 2px solid var(--line); color: var(--muted); font-size: 14px; }
.hubline b { font: 22px/1 var(--pixel); color: var(--ink); }
.hubline b.neg { color: var(--danger); }
.hubline b.pos { color: var(--jade); }
.hubline em { font-style: normal; font-size: 12px; padding: 1px 8px; background: var(--gold-soft); color: var(--gold); }
.hubline .chev, .offer.tap .chev { margin-left: auto; font-style: normal; color: var(--muted); font-size: 18px; }
.hubline.ctv { justify-content: space-between; border-style: dashed; }
.hubline.ctv span { flex: 1; }
.offer.tap { display: flex; flex-direction: column; width: 100%; text-align: left; padding: 12px; cursor: pointer; }
.offer.tap .row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.offer.tap .offer-line { color: var(--muted); }
.offer.tap .offer-line em { font-style: normal; color: var(--gold); }

/* ---- Màn brief: chữ hiện dần ---- */
.msg[hidden], .after-brief[hidden], #brief-skip[hidden] { display: none !important; }
#brief-skip { display: block; align-self: center; min-height: 44px; }

/* ---- Dòng tiền (kinh tế v2.1) ---- */
.cashline { display: block; color: var(--muted); font-size: 13px; margin-top: -6px; }
.cashline b { color: var(--ink); } .cashline b.neg { color: var(--danger); }
.v-card .btn + .why-not + .btn { margin-top: 8px; width: 100%; }
.task .cost .cost-n { display: block; font: 13px/1.2 var(--body); color: var(--ink); letter-spacing: 0; text-align: right; font-weight: 600; }
.task .cost .dots { font-style: normal; display: block; text-align: right; }
.sheet-actions.stacked > div { display: flex; flex-direction: column; gap: 4px; }
.sheet-actions.stacked small { font-size: 13px; line-height: 1.35; }
.crisis-opt .reason, small.reason { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
.task .cost .money { display: block; font: 13px/1.2 var(--body); color: var(--muted); text-align: right; }

/* Thẻ văn phòng: điều kiện mở (mục 1.9) */
.opt .unlock { display: block; font-size: 13px; line-height: 1.35; margin-top: 4px; color: var(--ink); }
.opt .unlock em { font-style: normal; color: var(--danger); }
.opt .unlock.ok em { color: var(--jade); }

/* ---- Đợt 2: cảnh nền ---- */
/* Màn chuẩn bị: cảnh thấp hơn mặc định, cuộn xuống thì thu hẳn lại; HUD (tuần, lượt) luôn dính trên đầu. */
.stage canvas { transition: height .2s ease; }
.stage.compact.prep canvas { height: 84px; }
.stage.compact.prep.meet canvas { height: 140px; }
.stage.folded canvas { height: 0 !important; }
.stage.folded .place { display: none; }
.stage.folded { border-bottom-width: 0; }
/* Tổng kết và Quyết toán: cảnh cuộn đi theo trang, cao khoảng 30% màn hình. */
.top.flow { position: static; }
.top.flow #hud { position: sticky; top: env(safe-area-inset-top, 0px); }
.stage.read canvas { aspect-ratio: auto; height: 30vh; height: 30dvh; max-height: none !important; object-fit: cover; object-position: 50% 72%; }
@media (prefers-reduced-motion: reduce) { .stage canvas { transition: none; } }

/* Cảnh báo rủi ro: lần đầu hiện đủ kèm việc chuẩn bị; đã xem thì thu lại một dòng. */
.need-hint { display: block; font-weight: 500; font-size: 13px; color: var(--muted); margin-top: 2px; }
.need.one { padding-block: 4px; font-size: 13px; font-weight: 500; }
.need.one > span:nth-child(2) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.need.one .need-mark { height: 20px; width: 24px; font-size: 16px; }

/* Ngày cưới: lựa chọn bị khoá gom dưới một dòng */
.locked-group { margin-top: 8px; }
.locked-group > summary { cursor: pointer; font-size: 14px; color: var(--muted); padding: 8px 2px; list-style: none; }
.locked-group > summary::before { content: "▸ "; }
.locked-group[open] > summary::before { content: "▾ "; }
.locked-group .list { opacity: .85; }

/* ---- Đợt 2: thẻ việc gọn, bốn trạng thái ---- */
.list:has(> .task) { gap: 8px; }
.task { padding: 9px 10px 9px 12px; gap: 8px; border-left-width: 5px; }
.task-main { gap: 3px; }
.task-main b { font-size: 15px; line-height: 1.3; }
.task-main small { font-size: 12.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.task .chips span { font-size: 12px; padding: 1px 6px; }
.task.promised { border-left-color: var(--gold); }
.task.st-overdue { border-color: var(--danger); border-left-color: var(--danger); background: #fff3f2; }
.task.st-noap { border-style: dashed; border-left-style: solid; border-left-color: var(--line); opacity: .62; }
.task.st-noap.promised { border-left-color: var(--gold); }
.task.locked { opacity: .62; }
.task .muted-chip { background: var(--surface-2); color: var(--muted); }
.task-done { padding: 6px 12px; border-left: 5px solid var(--jade); font-size: 14px; }

/* Hub: hồ sơ nhanh của lời mời */
.offer-prof { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.offer-prof .lvl { font-size: 12px; padding: 1px 7px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
.offer-prof .lvl.hi { background: #fde8e6; border-color: #f2b9b3; color: var(--danger); }
.offer-prof .lvl.mid { background: var(--gold-soft); border-color: #ead49a; color: #7a5a10; }
.offer-prof .lvl.lo { background: var(--jade-soft); border-color: #b6dccc; color: var(--jade); }
.offer-prof .lvl.gain { background: transparent; }
/* Giá trên thẻ khách: màu mực */
.offer .fee-range b { color: var(--ink); }

/* Thẻ vendor: bấm thanh để đọc giải thích tại chỗ */
.v-why > summary { cursor: pointer; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.v-why > summary::-webkit-details-marker { display: none; }
.v-why > summary::after { content: "Bấm để xem nghĩa là gì"; font-size: 11px; color: var(--muted); }
.v-why[open] > summary::after { content: "Thu lại"; }
.v-why p { margin: 6px 0 0; font-size: 13px; line-height: 1.4; background: var(--surface-2); padding: 6px 8px; }

.side-week { margin: 0; padding: 8px 10px; background: var(--surface-2); border-left: 4px solid var(--jade); font-size: 14px; }

/* Màn thiết lập: nút Tiếp ghim ở dưới cùng */
.setup-nav { position: sticky; bottom: 0; z-index: 5; background: var(--bg); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); margin-top: 4px; border-top: 1px solid var(--line); }
.confirm-box { border-color: var(--danger); gap: 8px; }
.confirm-box p { margin: 0; }

.short-left { display: block; margin-top: 4px; font-weight: 600; font-size: 13px; }

/* ---- Đợt 4: ô hội thoại theo vai ---- */
/* Planner (người chơi): màu riêng, bên phải; không khách nào dùng màu này. Khách và gia đình: nền trung tính, bên trái, vạch mảnh màu áo. */
:root { --bubble-me: #fde4ec; --bubble-me-line: var(--rose); --bubble-guest: #ffffff; }
.chat-wrap { display: flex; flex-direction: column; gap: 10px; }
.msg { align-items: flex-end; }
.msg .bub { display: flex; flex-direction: column; gap: 2px; min-width: 0; max-width: 82%; }
.msg.me .bub { align-items: flex-end; }
.msg .bub p { max-width: none; }
.msg .who { font-size: 11.5px; color: var(--muted); font-weight: 600; padding: 0 2px; }
.msg.guest p, .msg.groom p, .msg.groom-l p { background: var(--bubble-guest); border: 2px solid var(--ink); border-left: 5px solid var(--stripe, #b9b2bf); }
.msg.me p { background: var(--bubble-me); border: 2px solid var(--bubble-me-line); border-style: solid; }
.chat.solo .msg .bub { max-width: none; flex: 1; }

<script>
/*
 * WED/PLAN v1.2 — game rules shared by the browser game and the balance simulator.
 * Every function is pure: it reads (D, state) and returns numbers. No DOM here.
 */
(function (root) {
  "use strict";
  const clamp = (n, min = 0, max = 100) => Math.max(min, Math.min(max, n));

  // Deterministic random numbers from a seed (mulberry32), so a saved game rolls the same way.
  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a += 0x6d2b79f5;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const flag = (s, f) => !!(s.flags && s.flags[f]);
  const getVendor = (D, id) => D.vendors.find(v => v.id === id);
  const getSpec = (D, id) => D.specLevels.find(x => x.id === id) || D.specLevels[0];
  const getTier = (D, s) => D.tiers.find(t => t.id === s.tier) || D.tiers[1];

  // ---- Planning fee -------------------------------------------------------
  function feeQuote(D) {
    const m = D.feeModel, p = D.project;
    const guests = Math.max(p.engagementGuests || 0, p.weddingGuests || 0);
    const steps = Math.max(0, Math.ceil((guests - m.baseGuests) / m.guestStep));
    const scale = steps * m.stepFee;
    const extraEvent = p.engagementGuests && p.weddingGuests ? m.extraEvent : 0;
    const dest = p.location !== m.teamBase ? m.destinations[p.location] || { multiplier: 1.3, travel: 15 } : null;
    const subtotal = m.base + scale + extraEvent;
    const standard = Math.round(subtotal * (dest ? dest.multiplier : 1));
    return { base: m.base, scale, steps, guests, extraEvent, destination: dest, destinationName: dest ? p.location : null,
      destinationAdd: dest ? standard - subtotal : 0, travel: dest ? dest.travel : 0, standard };
  }
  function tierFee(D, tier) { return Math.round(feeQuote(D).standard * tier.feeFactor); }

  // ---- Vendors, cost and margin -------------------------------------------
  function vendorFor(D, s, cat) {
    const v = getVendor(D, (s.selectedVendors || {})[cat]);
    if (!v) return null;
    if (flag(s, `fallback_${cat}`)) {
      return { ...v, name: `${v.name} · booking khẩn`, price: Math.round(v.price * 1.15), quality: Math.max(1, v.quality - 1), reliability: 2, discount: 0, fallback: true };
    }
    return v;
  }
  function specFor(D, s, cat) { return getSpec(D, (s.specs || {})[cat] || "full"); }
  function vendorCost(D, s, cat) {
    const v = vendorFor(D, s, cat);
    if (!v) return 0;
    const spec = v.fallback ? getSpec(D, "full") : specFor(D, s, cat);
    const neg = v.fallback ? 1 : (s.negotiated && s.negotiated[v.id] ? 1 - v.discount : 1) - (s.negBonus || 0);
    const rush = flag(s, `rush_${cat}`) ? 1 + ((D.config.time && D.config.time.rushFee) || 0.2) : 1;
    const friend = (!v.fallback && s.contactDisc && s.contactDisc[v.id] ? 0.95 : 1) * (!v.fallback && s.surcharge && s.surcharge[v.id] ? 1 + s.surcharge[v.id] / 100 : 1); // mối quen vendor: −5%; không giữ quan hệ (thẻ tháng): +5%, một dự án
    return v.price * spec.factor * neg * rush * friend;
  }
  function lineMargin(D, s, cat) { return (D.budgetLines[cat] || 0) - vendorCost(D, s, cat); }
  function totalMargin(D, s) { return D.categories.reduce((sum, c) => sum + (s.selectedVendors && s.selectedVendors[c.id] ? lineMargin(D, s, c.id) : 0), 0); }
  function clientBudget(D) { return Object.values(D.budgetLines).reduce((a, b) => a + b, 0); }

  // ---- Risk ------------------------------------------------------------------
  function categoryRisk(D, s, cat) {
    const v = vendorFor(D, s, cat);
    const rm = D.riskModel;
    if (!v) return { pct: null, parts: [] };
    const parts = [];
    const base = rm.reliabilityBase[String(v.reliability)] || 20;
    parts.push({ label: `Độ tin cậy vendor ${v.reliability}/5`, value: base });
    const spec = v.fallback ? getSpec(D, "full") : specFor(D, s, cat);
    if (spec.risk) parts.push({ label: `Mức đầu tư: ${spec.label}`, value: spec.risk });
    if (v.fallback) parts.push({ label: "Vendor đặt khẩn", value: 10 });
    if (flag(s, `rush_${cat}`)) parts.push({ label: "Đặt gấp sau hạn", value: 10 });
    if (s.fatigue) parts.push({ label: `Team tăng ca ${s.fatigue} lần`, value: 3 * s.fatigue });
    Object.entries(rm.prep[cat] || {}).forEach(([f, val]) => { if (flag(s, f)) parts.push({ label: flagLabel(D, f), value: -val }); });
    Object.entries(rm.allCategories || {}).forEach(([f, val]) => { if (flag(s, f)) parts.push({ label: flagLabel(D, f), value: -val }); });
    const pct = clamp(parts.reduce((a, p) => a + p.value, 0), rm.min, rm.max);
    return { pct: Math.round(pct), parts };
  }
  function flagLabel(D, f) { return (D.flagLabels && D.flagLabels[f]) || (D.actions.find(a => a.flag === f || (a.flags || []).includes(f)) || {}).title || f; }

  function crisisChance(D, s, crisis) {
    const reasons = [];
    let pct = 0;
    const selected = Object.values(s.selectedVendors || {});
    for (const t of crisis.risk || []) {
      let add = 0;
      if (t.categoryRisk) { const r = categoryRisk(D, s, t.categoryRisk).pct || 0; add = r * (t.scale || 1); }
      else if (typeof t.base === "number") add = t.base;
      else if (t.ifMissing) add = flag(s, t.ifMissing) ? 0 : t.add;
      else if (t.ifDone) add = flag(s, t.ifDone) ? t.add : 0;
      else if (t.ifVenueKind) { const v = vendorFor(D, s, "venue"); add = v && t.ifVenueKind.includes(v.kind) ? t.add : 0; }
      else if (t.ifConcept) add = t.ifConcept.includes(s.selectedConcept) ? t.add : 0;
      else if (t.ifVendor) add = t.ifVendor.some(id => selected.includes(id)) ? t.add : 0;
      else if (t.ifMark) add = (s.marks || []).includes(t.ifMark) ? t.add : 0;
      if (add) { pct += add; reasons.push({ text: t.reason, value: Math.round(add) }); }
    }
    return { pct: Math.round(clamp(pct, 0, 90)), reasons };
  }
  function rollCrises(D, s, seed, event) {
    const r = rng(seed);
    return D.crises.filter(c => !event || c.event === event).map(c => {
      const ch = crisisChance(D, s, c);
      const roll = r() * 100;
      return { id: c.id, pct: ch.pct, reasons: ch.reasons, happened: ch.pct > 0 && roll < ch.pct };
    });
  }

  // ---- Option grading --------------------------------------------------------
  function optionKind(o) {
    const req = o.requires || [];
    const fx = o.effects || {};
    if (req.length) return "prep";
    if (fx.clientPays) return "client";
    if (fx.cost) return "agency";
    return "absorb";
  }
  const GRIEVANCE = { prep: 0.5, agency: 1, client: 2, absorb: 3 };

  // ---- Satisfaction ------------------------------------------------------------

    const ctx = canvas.getContext("2d");

    const pts = [];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (filled(x, y)) continue;
      if (filled(x - 1, y) || filled(x + 1, y) || filled(x, y - 1) || filled(x, y + 1)) pts.push([x, y]);
    }
    ctx.fillStyle = OUTLINE;
    pts.forEach(([x, y]) => ctx.fillRect(x, y, 1, 1));
  }

  // ---- Đi làm thêm (thay CTV): chỉ ở văn phòng, giữa hai dự án. Mỗi việc một ngày, đủ 5 ngày thì qua một tuần lịch. ----
  const SJ = C.SIDE_JOBS;

  const sideEmployer = id => SJ.employers.find(x => x.id === id) || {};
  function sideBlock() {

  function workSide(kindId) {
    const c = state.career, why = sideBlock(); if (why) return toast(why, "warn");
    if (!state.sideOffers) state.sideOffers = CORE.sideOffers(c, SJ, CAL.rnd);
    const offer = state.sideOffers.find(o => o.kind === kindId); if (!offer) return;
    const e = CORE.workSideDay(c, SJ, offer, CAL.rnd, hasSkill);
    const story = sideStory(e); let learned = null;
    // Tổng của tuần làm thêm đang dở (Đợt 2): tiền đã nhận, và tiền bên thuê còn nợ (trả chậm).
    const wk = (c.sideWeek = c.sideWeek || { paid: 0, owed: 0 }); wk.paid = r1(wk.paid + (e.paid || 0)); if (e.outcome === "late") wk.owed = r1(wk.owed + e.pay);
    if (e.skill && state.me && !state.me.skills.includes(e.skill)) {
      state.me.skills.push(e.skill); learned = { skill: e.skill, text: e.moment };

      c.sideDays -= SJ.daysPerWeek; const m0 = c.monthNo; state.sideLast.week = { ...c.sideWeek }; c.sideWeek = { paid: 0, owed: 0 };
      if (!tickWeek()) return;
      checkStage();

  function takeLoan() {

  }
  // Vai tuyển được lúc này: lần tuyển đầu tiên chỉ Sales, Marketing, Designer; sau đó thêm Coordinator, Planner theo cấp.
  const rolesOpen = (c = state.career) => C.ROLES.filter(r => c.stage >= r.minStage && (r.first || c.staffSeq > 0));
  // Ứng viên của một vai trong tháng này (gói B: 6 người mỗi vai): hiện 3–6 người, cố định trong tháng, đổi khi sang tháng. Người đang làm cho mình thì không hiện.
  function candidates(roleId) {

    const working = new Set(c.staff.map(s => s.cand));
    const pool = C.CANDIDATES.filter(x => x.role === roleId).map(x => ({ x, k: r() })).sort((a, b) => a.k - b.k).map(o => o.x);
    const n = H.minCandidates + Math.floor(r() * (H.maxCandidates - H.minCandidates + 1));
    return pool.slice(0, n).filter(x => !working.has(x.id));

  function hire(role, candId) {

    const list = candidates(role); const x = list.find(k => k.id === candId) || list[0]; if (!x) return toast("Tháng này không còn ứng viên nào cho vai này", "warn");

  // Hồ sơ nhanh của một lời mời (Đợt 2): độ khó, rủi ro, lợi ích, tính từ dữ liệu có sẵn của lời mời, không thêm cơ chế.
  function offerProfile(o) {
    const T = C.TYPES[o.type]; const trait = C.TRAITS.find(t => t.id === o.trait);

    if (o.weeks < T.weeks) hard.push(`gấp: ${o.weeks} tuần chuẩn bị`);
    if (o.guests > (T.guests[0] + T.guests[1]) / 2) hard.push(`đông khách (${o.guests})`);
    if (trait && (trait.expect < 0 || trait.actionCost || trait.wishMult || trait.deadlineShift)) hard.push(lc(trait.name));

    if ((o.premiumExpect || []).length) hard.push("khách quen đồ cao cấp");
    if (o.type === "dayof") { const weak = Object.values(o.preset || {}).map(id => BASE.vendors.find(v => v.id === id)).filter(v => v && v.reliability <= 2); if (weak.length) risk.push(`khách chọn ${weak.length} vendor kém tin cậy (${weak.map(v => v.name).join(", ")})`); }

    const out = [];
    if (trait) out.push([trait.name, trait.note]);
    if (ct && ct.profile.id !== "classic") out.push([ct.profile.name, ct.profile.summary]);
    if (["destination", "overseas", "luxury", "boss"].includes(o.type)) out.push([T.name, T.note]);

      ${c.loan ? `<p class="note">Đang nợ ${money(c.loan.repay)}, trả sau ${c.loan.left} tháng.</p>` : ""}
    </section>`;
  }
  // Văn phòng và mức sống: hai lựa chọn riêng, đổi lúc nào cũng được, áp dụng từ kỳ thu tháng kế tiếp.
  function choiceList(title, list, cur, next, act, extra) {

  }
  function contactsHtml() {
    const c = state.career; const rows = [];

      for (let i = 1; i < tierObj().team; i++) s.add(`team${i}`, i % 2 ? SP.PEOPLE.staff : SP.PEOPLE.staff2, 60 + i * 20, 112, { zone: floor, speed: 24 });
    }
  }
  function visit(vendorId) {
    if (!scene || !sceneKey.startsWith("prep")) return;
    const look = SP.VENDOR_LOOKS[vendorId]; if (!look) return;
    const id = `visit_${vendorId}`; scene.remove(id);
    const a = scene.add(id, look, 170, 70, { still: true, speed: 30, bubble: "♥" });
    a.tx = 112; a.ty = 84;
    setTimeout(() => { if (!scene) return; const x = scene.get(id); if (x) { x.tx = 172; x.ty = 66; x.exitAfter = true; x.bubble = null; } }, 2600);
  }
  // a crisis whose actor is not in the current scene falls back to the planner
  const onStage = id => (scene && scene.get(id) ? id : "me");
  // Cảnh thấp (Đợt 4): văn phòng ở màn hub, khách mới, báo phí, chuẩn bị, quyết toán: mọi người đứng ngay trước bàn (chân y 62–70),
  // để khung 84pt thấy trọn người cùng cửa sổ, kệ và bàn phía sau. Màn thiết lập, mở đầu, kết thúc vẫn dùng cảnh đầy đủ.
  const OFFICE_BAND = { y0: 62, y1: 70 };
  function officeBand(want) {
    if (want.kind !== "office" || ["title", "over"].includes(want.key) || want.key.startsWith("setup")) return;
    const b = OFFICE_BAND, cl = y => Math.max(b.y0, Math.min(b.y1, y - 26));
    scene.walk = { ...scene.walk, y0: b.y0, y1: b.y1 };
    scene.actors.forEach(a => { a.y = cl(a.y); a.ty = cl(a.ty); });
  }
  // Neo khung cắt của cảnh thấp: đáy khung ngay dưới chân người đứng thấp nhất, phần còn lại là tường và bàn phía sau.
  function fitStage() {
    const st = document.getElementById("stage"), cv = st && st.querySelector("canvas"); if (!cv || !scene) return;
    if (!st.classList.contains("compact") || st.classList.contains("folded")) { cv.style.objectPosition = ""; return; }
    const W = 192, H = scene.h || 120, cw = cv.clientWidth, ch = cv.clientHeight; if (!cw || !ch) return;
    const k = Math.max(cw / W, ch / H), hc = ch / k; // số hàng điểm ảnh của cảnh lọt vào khung
    const feet = scene.actors.filter(a => a.x > -10 && a.x < W + 10).map(a => (a.still || !a.wander ? Math.max(a.y, a.ty) : Math.max(a.y, scene.walk.y1)));
    const bottom = Math.min(H, (feet.length ? Math.max(...feet) : H * 0.8) + 4);
    const top = Math.max(0, Math.min(H - hc, bottom - hc));
    cv.style.objectPosition = `50% ${-Math.round(top * k)}px`;
  }
  function syncScene() {
    const host = $("#stage canvas"); if (!host) return;
    if (!scene || scene.canvas !== host) { scene = new SC.Scene(host); sceneKey = ""; }
    const want = desiredScene();
    if (want.key !== sceneKey) { scene.set(want.kind, want.opts || {}); sceneKey = want.key; cast(want.key); officeBand(want); }
    fitStage();
    scene.start();
    scene.clearBubbles(); scene.rain = false;
    const p = state.phase;
    if (p === "setup") scene.bubble("me", state.setup.step === 0 ? "…" : "♥");
    if (p === "hub") scene.bubble("me", state.career.canUpgrade || state.career.pendingBrand ? "!" : "♪");
    if (p === "quote") scene.bubble("bride", "?");
    if (p === "brief") scene.bubble(state.briefStep % 2 ? "groom" : "bride", "…");
    if (sceneKey.startsWith("meet-")) scene.bubble("guest", "…");
    if (p === "prep" && state.sheet?.type === "meeting") scene.bubble("me", "…");
    else if (p === "prep" && state.ap === 0) scene.bubble("me", "✓");
    if (p === "settlement") scene.bubble("bride", state.settlementOutcome ? (state.settlementOutcome.c >= 0 ? "♥" : "…") : "₫", state.settlementOutcome && state.settlementOutcome.c < 0 ? "upset" : null);
    if (p === "review") { const st = state.result?.stars || 0; const b = st >= 4 ? "♥" : "…", m = st >= 4 ? "happy" : st <= 2 ? "upset" : null; scene.bubble("bride", b, m); scene.bubble("groom", b, m); }
    if (p === "event") {
      const item = state.queue[state.qi];
      Object.values(crisisActor).forEach(id => scene.release(id)); D.crises.forEach(c => c.actor && scene.release(c.actor)); scene.release("me");
      const last = state.queue[state.lastResolved];
      if (last && last.k === "crisis" && last.out && last.event === state.stage) {
        const t = last.out.tone; scene.bubble(onStage(crisisActor[last.id] || getCrisis(last.id).actor), t === "good" ? "♥" : t === "ok" ? "✓" : "…", t === "good" || t === "ok" ? "happy" : "upset");
      }
      if (item?.k === "crisis") {
        const actor = onStage(crisisActor[item.id] || getCrisis(item.id).actor); const me = scene.get("me");
        if (item.id === "weather") scene.rain = true;
        scene.bubble(actor, "!"); if (actor !== "me") scene.bubble("me", "?");
        if (me && actor !== "me" && scene.get(actor)) { scene.moveTo(actor, me.x + 12, me.y); scene.moveTo("me", me.x, me.y); }
      } else if (item?.k === "end") { const ok = state.stageHits === 0; scene.bubble("bride", ok ? "♥" : "…"); scene.bubble("groom", "♥"); }
    }
  }

    if (["mom_bride", "dad_bride", "mom_groom", "dad_groom"].includes(who)) return famLook(who);
    if (SP.PEOPLE[who]) return SP.PEOPLE[who];
    if (who.startsWith("v_")) return SP.VENDOR_LOOKS[E.vendorFor(D, state, who.slice(2))?.id] || SP.PEOPLE.staff;
    return SP.PEOPLE.staff;

  // Thẻ thiếu tiền trước lễ: dùng chung ô tình huống của tuần, không bao giờ hiện cùng lúc với tình huống khác.

  // Thẻ việc (Đợt 2): gọn hơn, và bốn trạng thái nhìn là biết: đã hứa (viền vàng), quá hạn (viền đỏ), chưa đủ lượt (viền đứt, mờ), đã xong (dòng xanh).

  // Lý do bằng lời đi kèm nhãn cảm xúc (mục 1.2). Không có tác động cảm xúc thì không có nhãn, cũng không cần lý do.
  const crisisReason = (cr, o) => { const fx = o.effects || {}; if (!fx.couple && !fx.family) return ""; const r = ((C.CRISIS_REASONS || {})[cr.id] || {})[o.id]; return r ? r[0].toUpperCase() + r.slice(1) : ""; };
  // Lựa chọn dùng được đứng trước; lựa chọn bị khoá gom dưới một dòng, vẫn ghi việc nào lẽ ra mở được (Đợt 2).
  function crisisOptions(cr) {
    // Nhãn của lựa chọn (Đợt 4): lựa chọn có rủi ro không bao giờ ghi "Chắc chắn"; mỗi rủi ro gộp thành MỘT nhãn "N% chuyện gì: ai ra sao";

    const one = o => {
      const why = optionBlock(o); const ch = successChance(cr, o); const who = (D.reactions[cr.id] || {}).who; const ar = o.afterRisk;
      const own = ((C.CRISIS_MOOD || {})[cr.id] || {})[o.id];
      const fx = o.effects || {};
      const base = own && !state.showNums ? effectChips({ ...fx, couple: 0, family: 0 }, who).replace(/<span>Không tốn gì<\/span>/, "") + `<span class="neg">${esc(own)}</span>` : effectChips(fx, who);
      const risk = why ? "" : ar ? `<span class="gold risk">${ar.p}% ${esc(lower(ar.label))}: ${esc(lc(moodText({ couple: ar.couple, family: ar.family }, who)))}</span>`
        : ch < 100 ? `<span class="${ch < 65 ? "neg" : "gold"} risk">${ch >= 85 ? "Chắc ăn" : ch >= 65 ? "Khá chắc" : "Hên xui"} ${ch}% · hỏng thì cả hai bên phật ý thêm</span>`
        : `<span class="pos">Chắc chắn</span>`;

    };

  function crisisDone(item, n) {

  // Mong muốn có việc để đáp ứng không (mục 1.13): gói day-of không chọn vendor, nên mong muốn cần vendor mà khách tự chốt thì không tính là lỗi;
  // mong muốn của một buổi lễ không có trong gói cũng vậy.
  function wishPossible(w) {
    if (w.event && !evList().includes(w.event)) return false;
    if (isDayof(state.project) && w.needs && !w.coord) return false; // day-of: khách tự chốt và tự trả vendor, planner không có việc nào đổi được hạng mục đó
    return true;

  // Quyết định nào làm sự cố nào dễ xảy ra hơn, và sự cố đó đã xảy ra (mục 1.13, Nhìn lại ý 2).
  function markLinks() {
    const src = state.markSrc || {}; const out = [];
    (state.rolls || []).filter(x => x.happened).forEach(x => { const c = getCrisis(x.id); (c.risk || []).forEach(t => { if (t.ifMark && t.add > 0 && state.marks.includes(t.ifMark) && src[t.ifMark]) out.push({ from: src[t.ifMark], crisis: c.title, add: t.add }); }); });
    return out;

  function lessons(r) {

    const missedWishes = D.wishes.filter(w => w.kind === "wish" && state.revealed.includes(w.id) && !flag(`wish_${w.id}`) && wishPossible(w));
    if (missedWishes.length) out.push(`Bạn biết ${missedWishes.length} mong muốn của khách nhưng chưa đáp ứng: ${missedWishes.map(w => lower(w.title)).join(", ")}.`);
    const unknown = D.wishes.filter(w => w.kind === "wish" && !state.revealed.includes(w.id)).length;

    after.forEach(e => { e.hidden = true; }); if (skip) skip.hidden = false;
    const finish = () => { A.done = true; msgs.forEach((m, i) => { m.hidden = false; m.querySelector("p").textContent = full[i]; }); after.forEach(e => { e.hidden = false; }); if (skip) skip.hidden = true; if (scene) scene.clearBubbles(); };
