<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WED/PLAN">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>WED/PLAN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700&family=VT323&display=swap">
<style>
/* Layout: one phone-width column. Sticky HUD, pixel scene under it, cards below, tab bar fixed at the bottom during prep. */
:root {
  --bg: #fbf1f2;
  --surface: #ffffff;
  --surface-2: #f6e6ea;
  --ink: #2b1f33;
  --muted: #7c6b80;
  --line: #ead7dd;
  --rose: #d9577a;
  --on-rose: #ffffff;
  --jade: #23806c;
  --jade-soft: #dff1ec;
  --gold: #9a6a12;
  --gold-soft: #fbefd2;
  --danger: #c43d32;
  --danger-soft: #fbe3e0;
  --desk: #efe0e4;
  --pixel: "VT323", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --nav-h: 132px;
  color-scheme: light; /* Nền tối đã bỏ (Thanh, 11/11/2026): game luôn sáng, kể cả khi máy bật chế độ tối */
}
* { box-sizing: border-box; }
/* Nền đứng yên (Thanh, 11/11/2026): trang chỉ cuộn khi nội dung dài hơn màn hình.
   overscroll-behavior tắt kiểu "kéo nảy" của iPhone; 100dvh bên dưới là chiều cao phần màn hình thật sự nhìn thấy
   (100vh trên Safari iPhone cao hơn màn hình, nên màn nào cũng kéo được một đoạn). */
html { background: var(--desk); overscroll-behavior: none; }
body { margin: 0; overscroll-behavior: none; background: var(--desk); color: var(--ink); font: 15px/1.5 var(--body); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }
img.sprite { image-rendering: pixelated; image-rendering: crisp-edges; display: block; flex: none; }
.neg { color: var(--danger); }
.pos { color: var(--jade); }
.muted { color: var(--muted); }
.center { text-align: center; }

#app { max-width: 460px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; background: var(--bg); position: relative; box-shadow: 0 0 0 1px var(--line); }

/* HUD */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 2px solid var(--ink); }
.hud-in { display: flex; align-items: center; gap: 10px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hud-who { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.hud-who b { display: block; font: 24px/1 var(--pixel); }
.hud-who small { color: var(--muted); font-size: 12px; }
.hud-face { width: 40px; height: auto; }
.pips { display: flex; gap: 4px; }
.pips i { width: 12px; height: 12px; border: 2px solid var(--ink); background: transparent; }
.pips i.on { background: var(--rose); }
.hud-right { display: flex; align-items: center; gap: 8px; }
.coin { font: 20px/1 var(--pixel); background: var(--gold-soft); color: var(--gold); padding: 4px 8px; border: 2px solid currentColor; white-space: nowrap; }
.coin.neg { background: var(--danger-soft); color: var(--danger); }
.icon-btn { width: 40px; height: 40px; border: 2px solid var(--ink); background: var(--surface); font-size: 20px; line-height: 1; }

/* Scene */
.stage { background: var(--ink); border-bottom: 2px solid var(--ink); }
.stage.pinned { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 19; }
.stage canvas { display: block; width: 100%; height: auto; aspect-ratio: 192 / 120; image-rendering: pixelated; image-rendering: crisp-edges; max-width: 100%; }

/* Main */
.main { padding-block: 16px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.main.with-nav { padding-bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.h { font: 26px/1.05 var(--pixel); margin: 0; letter-spacing: .01em; text-wrap: balance; }
.h.big { font-size: 34px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card { background: var(--surface); border: 2px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card.slim { padding: 10px 12px; gap: 2px; }
.card.center { align-items: center; text-align: center; }
.card p { margin: 0; }
.row-between { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.hint, .week-note { margin: 0; color: var(--muted); font-size: 14px; }
.empty { color: var(--muted); text-align: center; margin: 8px 0; }

/* Buttons */
.btn { min-height: 48px; padding: 10px 16px; border: 2px solid var(--ink); background: var(--surface); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 3px 3px 0 var(--ink); }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.btn.primary { background: var(--rose); color: var(--on-rose); }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font-size: 12px; padding: 2px 8px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.chips span.neg { background: var(--danger-soft); color: var(--danger); }
.chips span.pos { background: var(--jade-soft); color: var(--jade); }
.chips span.gold { background: var(--gold-soft); color: var(--gold); }

/* Title */
.title-card { display: flex; flex-direction: column; gap: 12px; }
.logo { font: 64px/0.9 var(--pixel); margin: 4px 0 0; letter-spacing: .02em; }
.logo span { color: var(--rose); }
.lede { margin: 0; max-width: 36ch; }
.pick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pick { background: var(--surface); border: 2px solid var(--line); padding: 12px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.pick:hover { border-color: var(--rose); }
.pick b { font: 26px/1 var(--pixel); }
.pick small { color: var(--muted); font-size: 12px; line-height: 1.35; }
.tag { font-size: 12px; font-weight: 700; background: var(--rose); color: var(--on-rose); padding: 1px 8px; }
img.big { width: 72px; height: auto; }

/* Brief chat */
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.facts span { background: var(--surface); border: 2px solid var(--line); padding: 8px; display: flex; flex-direction: column; min-width: 0; }
.facts small { color: var(--muted); font-size: 11px; }
.facts b { font: 22px/1 var(--pixel); }
.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { display: flex; gap: 8px; align-items: flex-end; }
.msg.groom, .msg.me { flex-direction: row-reverse; }
.msg p { margin: 0; background: var(--surface); border: 2px solid var(--ink); padding: 10px 12px; max-width: 80%; position: relative; }
.msg.groom p, .msg.me p { background: var(--surface-2); }
.msg.solo p { max-width: none; text-align: left; }
img.face { width: 40px; height: auto; }

/* Quote */
.rows { margin: 0; display: flex; flex-direction: column; }
.rows div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.rows dt { color: var(--muted); }
.rows dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rows .sum { border-bottom: 0; border-top: 2px solid var(--ink); }
.rows .sum dt { color: var(--ink); font-weight: 700; }
.tier { text-align: left; background: var(--surface); border: 2px solid var(--ink); padding: 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: 3px 3px 0 var(--ink); }
.tier:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.tier p { margin: 0; color: var(--muted); font-size: 14px; }
.tier-top { display: flex; justify-content: space-between; align-items: baseline; }
.tier-top b { font-size: 17px; }
.big-num { font: 32px/1 var(--pixel); color: var(--rose); }

/* Prep lists */
.list { display: flex; flex-direction: column; gap: 8px; }
.banner { text-align: left; border: 2px solid var(--gold); background: var(--gold-soft); color: var(--ink); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.banner span { font-size: 13px; color: var(--muted); }
.task { text-align: left; background: var(--surface); border: 2px solid var(--line); padding: 12px; display: flex; gap: 10px; align-items: flex-start; }
.task:hover { border-color: var(--rose); }
.task-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.task-main small { color: var(--muted); font-size: 13px; line-height: 1.4; }
.task em, .opt em { font-style: normal; font-size: 12px; color: var(--danger); }
.task.locked { opacity: .6; }
.cost { color: var(--rose); letter-spacing: 2px; font-size: 14px; }
.done { color: var(--muted); font-size: 14px; }
.done ul { margin: 6px 0 0; padding-left: 18px; }
.cats { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cat { flex: none; border: 2px solid var(--line); background: var(--surface); padding: 6px 10px; display: flex; align-items: center; gap: 6px; font-size: 14px; }
.cat i { font-style: normal; font-size: 11px; color: var(--muted); }
.cat.on { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.cat.on i { color: var(--bg); }
.vrow { text-align: left; background: var(--surface); border: 2px solid var(--line); padding: 10px; display: flex; gap: 10px; align-items: center; }
.vrow.sel { border-color: var(--jade); }
.vrow-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.vrow-main small { color: var(--muted); font-size: 12px; }
.vrow-num { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
.vrow-num b { font: 24px/1 var(--pixel); }
.vrow-num small { font-size: 12px; font-weight: 700; }
.badge { font-size: 11px; background: var(--jade); color: var(--surface); padding: 0 6px; margin-top: 2px; }
.stars { color: var(--gold); letter-spacing: 1px; font-size: 13px; }
.stars i { font-style: normal; color: var(--line); }
.risks { display: flex; flex-direction: column; gap: 6px; }
.risk { display: grid; grid-template-columns: 1fr 70px 42px; align-items: center; gap: 8px; font-size: 14px; }
.risk b { text-align: right; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--surface-2); }
.bar i { display: block; height: 100%; background: var(--jade); }
.bar i.warm { background: var(--gold); }
.bar i.hot { background: var(--danger); }
.bul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.checks li { color: var(--muted); }
.checks li.ok { color: var(--jade); }
.checks small { color: var(--muted); }

/* Event */
.crisis { border-color: var(--ink); }
.why summary, details.card summary { cursor: pointer; font-weight: 700; }
.why ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
.opt { text-align: left; background: var(--surface); border: 2px solid var(--ink); padding: 12px; display: flex; flex-direction: column; gap: 6px; box-shadow: 3px 3px 0 var(--ink); }
.opt:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.opt small { color: var(--muted); }
.opt.locked { border-color: var(--line); box-shadow: none; opacity: .7; }
.opt.on { background: var(--surface-2); border-color: var(--rose); }
.outcome { border-color: var(--jade); }
.outcome.absorb { border-color: var(--danger); }
.outcome.client { border-color: var(--gold); }
.outcome h3 { margin: 0; font-size: 17px; }

/* Review */
.stars-big { font-size: 40px; color: var(--gold); letter-spacing: 4px; line-height: 1; }
.stars-big i { font-style: normal; color: var(--line); }
.score3 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.score3 div { background: var(--surface); border: 2px solid var(--line); padding: 10px; display: flex; flex-direction: column; }
.score3 small { color: var(--muted); font-size: 12px; }
.score3 b { font: 32px/1 var(--pixel); }
.score3 .total { grid-column: 1 / -1; border-color: var(--ink); background: var(--gold-soft); }
.score3 .total b { font-size: 44px; color: var(--gold); }

/* Bottom nav */
.nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(460px, 100%); z-index: 20; background: var(--surface); border-top: 2px solid var(--ink); }
.nav-in { padding-top: 10px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; }
.next { width: 100%; }
.muted-on { font-weight: 400; font-size: 13px; opacity: .85; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { background: none; border: 0; padding: 4px 0; display: flex; flex-direction: column; align-items: center; font-size: 12px; color: var(--muted); min-height: 44px; }
.tab span { font-size: 18px; line-height: 1.1; }
.tab.on { color: var(--rose); font-weight: 700; }

/* Bottom sheet */
#sheet .backdrop { position: fixed; inset: 0; background: rgba(28, 21, 36, .5); z-index: 40; }
.sheet { position: fixed; z-index: 41; left: 50%; bottom: 0; transform: translateX(-50%); width: min(460px, 100%); max-height: 86vh; overflow-y: auto; background: var(--bg); border-top: 2px solid var(--ink); padding-top: 18px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; animation: up .18s ease-out; }
@keyframes up { from { transform: translate(-50%, 24px); opacity: .6; } }
.sheet p { margin: 0; }
.sheet-x { position: absolute; top: 8px; right: max(12px, env(safe-area-inset-right, 0px)); width: 40px; height: 40px; border: 0; background: none; font-size: 26px; color: var(--muted); }
.sheet-head { display: flex; gap: 12px; align-items: center; padding-right: 36px; }
.sheet-actions { display: flex; flex-direction: column; gap: 8px; }
.quote { font-style: italic; color: var(--muted); }
.note { font-size: 14px; color: var(--muted); }
.specs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.spec { border: 2px solid var(--line); background: var(--surface); padding: 8px 6px; display: flex; flex-direction: column; gap: 1px; text-align: left; font-size: 13px; min-width: 0; }
.spec b { font-size: 14px; }
.spec small { color: var(--muted); font-size: 11px; }
.spec.on { border-color: var(--ink); background: var(--surface-2); }
.log { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.log li { border-left: 3px solid var(--line); padding-left: 8px; }
.log li.good { border-color: var(--jade); }
.log li.bad { border-color: var(--danger); }
.log small { color: var(--muted); margin-right: 6px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: var(--bg); padding: 8px 14px; font-size: 14px; max-width: min(420px, 90%); }
.toast.warn { background: var(--danger); color: #fff; }
.toast.good { background: var(--jade); color: var(--surface); }

@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .btn:active, .opt:active, .tier:active { transform: none; } }
.hud-who b, .coin { white-space: nowrap; }
.facts b { font-size: 21px; overflow-wrap: anywhere; }
#main:not(.with-nav) ~ .toast { bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }

/* v2.1: time, meetings, wishes, outcomes */
button.pips { background: none; border: 0; padding: 6px 2px; flex-wrap: wrap; max-width: 92px; }
.small { font-size: 12px; }
.time { gap: 8px; }
.time-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.mini { border: 2px solid var(--ink); background: var(--surface); padding: 6px 8px; font-size: 13px; font-weight: 700; min-height: 40px; }
.mini.primary { background: var(--rose); color: var(--on-rose); }
.mini:disabled { opacity: .45; cursor: not-allowed; }
.banner.rose { border-color: var(--rose); background: var(--surface-2); }
.task.meet { border-color: var(--rose); }
.vrow.full { opacity: .5; }
.badge.warn { background: var(--gold); }
.wish { display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 2px dashed var(--rose); background: var(--surface-2); }
.wish > div { display: flex; flex-direction: column; gap: 4px; }
.wish small { color: var(--muted); }
.wish em { font-style: normal; font-size: 12px; color: var(--muted); }
.wish.done { border-style: solid; border-color: var(--jade); background: var(--jade-soft); }
.wish.taboo { border-color: var(--gold); background: var(--gold-soft); }
.wish.taboo.broken { border-color: var(--danger); background: var(--danger-soft); }
.wish > span { font-weight: 700; font-size: 13px; }
.unlock { align-self: center; font-size: 13px; font-weight: 700; padding: 4px 10px; background: var(--jade-soft); color: var(--jade); border: 2px solid currentColor; }
.unlock.taboo { background: var(--gold-soft); color: var(--gold); }
.unlock.info { background: var(--surface); color: var(--ink); }
.msg.groom-l p { background: var(--surface-2); }
.mark { margin: 0; font-size: 14px; padding: 8px 10px; background: var(--gold-soft); color: var(--ink); border-left: 4px solid var(--gold); }
.moment { border-color: var(--jade); }
.moment.bad { border-color: var(--danger); }
.outcome.good { border-color: var(--jade); }
.outcome.ok { border-color: var(--jade); }
.outcome.fail { border-color: var(--gold); }
.outcome.bad { border-color: var(--danger); }

/* v2.2: one-screen week */
:root { --nav-h: 76px; }
.hud .status { display: grid; grid-template-columns: 1fr 1.3fr 1.3fr; gap: 6px; padding-bottom: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stat { border: 2px solid var(--ink); background: var(--surface); padding: 4px 8px; text-align: left; display: flex; flex-direction: column; min-width: 0; }
.stat small { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat b { font: 24px/1 var(--pixel); }
.stat b i { font-style: normal; font-size: 16px; color: var(--muted); }
.stat.gold b { color: var(--gold); }
.stat.neg b { color: var(--danger); }
.stat.cool b { color: var(--jade); }
.stat.warm b { color: var(--gold); }
.stat.hot b { color: var(--danger); }
.coin { cursor: pointer; }
.sec { font: 24px/1 var(--pixel); margin: 6px 0 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.link { background: none; border: 0; padding: 4px 0; color: var(--rose); font: 700 13px/1.2 var(--body); text-decoration: underline; text-underline-offset: 3px; }
.pick-cat { gap: 6px; }
.vopt, .vsel { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px dashed var(--line); }
.vsel { border-top: 0; }
.vopt.full { opacity: .5; }
.vopt-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.vopt-main b { font-size: 14px; line-height: 1.25; }
.vopt-num { display: flex; flex-direction: column; align-items: flex-end; }
.vopt-num b { font: 22px/1 var(--pixel); }
.vopt-num small { font-size: 12px; font-weight: 700; white-space: nowrap; }
.rel { font-size: 12px; font-weight: 700; }
.rel.r5, .rel.r4 { color: var(--jade); }
.rel.r3 { color: var(--gold); }
.rel.r2, .rel.r1 { color: var(--danger); }
.booked { gap: 6px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 2px solid var(--ink); }
.seg button { border: 0; border-left: 2px solid var(--ink); background: var(--surface); padding: 6px 4px; display: flex; flex-direction: column; align-items: center; font-size: 12px; min-height: 44px; }
.seg button:first-child { border-left: 0; }
.seg button b { font-size: 13px; }
.seg button.on { background: var(--ink); color: var(--bg); }
.seg button.on .pos, .seg button.on .neg { color: inherit; }
.pill { font-size: 12px; font-weight: 700; padding: 2px 8px; white-space: nowrap; }
.pill.cool { background: var(--jade-soft); color: var(--jade); }
.pill.warm { background: var(--gold-soft); color: var(--gold); }

<script>
/*
 * WED/PLAN v1.2 — game rules shared by the browser game and the balance simulator.
 * Every function is pure: it reads (D, state) and returns numbers. No DOM here.

  "use strict";
  const clamp = (n, min = 0, max = 100) => Math.max(min, Math.min(max, n));

  const flag = (s, f) => !!(s.flags && s.flags[f]);
  const getVendor = (D, id) => D.vendors.find(v => v.id === id);
  const getSpec = (D, id) => D.specLevels.find(x => x.id === id) || D.specLevels[0];
  const getTier = (D, s) => D.tiers.find(t => t.id === s.tier) || D.tiers[1];

  // ---- Planning fee -------------------------------------------------------
  function feeQuote(D) {
    const m = D.feeModel, p = D.project;
    const guests = Math.max(p.engagementGuests || 0, p.weddingGuests || 0);
    const steps = Math.max(0, Math.ceil((guests - m.baseGuests) / m.guestStep));
    const scale = steps * m.stepFee;
    const extraEvent = p.engagementGuests && p.weddingGuests ? m.extraEvent : 0;
    const dest = p.location !== m.teamBase ? m.destinations[p.location] || { multiplier: 1.3, travel: 15 } : null;
    const subtotal = m.base + scale + extraEvent;
    const standard = Math.round(subtotal * (dest ? dest.multiplier : 1));
    return { base: m.base, scale, steps, guests, extraEvent, destination: dest, destinationName: dest ? p.location : null,
      destinationAdd: dest ? standard - subtotal : 0, travel: dest ? dest.travel : 0, standard };
  }

  // ---- Vendors, cost and margin -------------------------------------------
  function vendorFor(D, s, cat) {
    const v = getVendor(D, (s.selectedVendors || {})[cat]);
    if (!v) return null;
    if (flag(s, `fallback_${cat}`)) {
      return { ...v, name: `${v.name} · booking khẩn`, price: Math.round(v.price * 1.15), quality: Math.max(1, v.quality - 1), reliability: 2, discount: 0, fallback: true };

  }
  function specFor(D, s, cat) { return getSpec(D, (s.specs || {})[cat] || "full"); }

    const v = vendorFor(D, s, cat);

    const neg = v.fallback ? 1 : (s.negotiated && s.negotiated[v.id] ? 1 - v.discount : 1) - (s.negBonus || 0);
    const rush = flag(s, `rush_${cat}`) ? 1 + ((D.config.time && D.config.time.rushFee) || 0.2) : 1;
    return v.price * spec.factor * neg * rush;
  }
  function lineMargin(D, s, cat) { return (D.budgetLines[cat] || 0) - vendorCost(D, s, cat); }
  function totalMargin(D, s) { return D.categories.reduce((sum, c) => sum + (s.selectedVendors && s.selectedVendors[c.id] ? lineMargin(D, s, c.id) : 0), 0); }

  // ---- Risk ------------------------------------------------------------------
  function categoryRisk(D, s, cat) {
    const v = vendorFor(D, s, cat);
    const rm = D.riskModel;
    if (!v) return { pct: null, parts: [] };
    const parts = [];
    const base = rm.reliabilityBase[String(v.reliability)] || 20;
    parts.push({ label: `Độ tin cậy vendor ${v.reliability}/5`, value: base });
    const spec = v.fallback ? getSpec(D, "full") : specFor(D, s, cat);
    if (spec.risk) parts.push({ label: `Mức đầu tư: ${spec.label}`, value: spec.risk });
    if (v.fallback) parts.push({ label: "Vendor đặt khẩn", value: 10 });
    if (flag(s, `rush_${cat}`)) parts.push({ label: "Đặt gấp sau hạn", value: 10 });
    if (s.fatigue) parts.push({ label: `Team tăng ca ${s.fatigue} lần`, value: 3 * s.fatigue });
    Object.entries(rm.prep[cat] || {}).forEach(([f, val]) => { if (flag(s, f)) parts.push({ label: flagLabel(D, f), value: -val }); });
    Object.entries(rm.allCategories || {}).forEach(([f, val]) => { if (flag(s, f)) parts.push({ label: flagLabel(D, f), value: -val }); });

  // ---- Option grading --------------------------------------------------------
  function optionKind(o) {
    const req = o.requires || [];
    const fx = o.effects || {};

    if (fx.clientPays) return "client";
    if (fx.cost) return "agency";

  }
  const GRIEVANCE = { prep: 0.5, agency: 1, client: 2, absorb: 3 };

  // ---- Satisfaction ------------------------------------------------------------
  const WEIGHTS = {
    venue: { c: 1.5, f: 1.5, cm: 0.8, fm: 0.4 },
    decor: { c: 2.5, f: 0.3, cm: 2.5, fm: 0.1 },
    rental: { c: 0.6, f: 0.5, cm: 0.7, fm: 0.4 },
    catering: { c: 0.8, f: 3.5, cm: 0.4, fm: 0.2 },
    photo: { c: 2.0, f: 0.2, cm: 1.5, fm: 0.3 },
    mc: { c: 0.5, f: 1.0, cm: 0.4, fm: 0.8 }
  };
  function vendorBonus(D, s) {
    let couple = 0, family = 0;
    D.categories.forEach(cat => {
      const v = vendorFor(D, s, cat.id);
      if (!v) return;
      const w = WEIGHTS[cat.id];
      const q = v.quality + (v.fallback ? 0 : specFor(D, s, cat.id).quality);
      // Below "acceptable" (3) quality hurts twice as much as the same amount above it helps.
      const qd = q >= 3 ? q - 3 : (q - 3) * 2;
      couple += qd * w.c + (v.match - 3) * w.cm;
      family += qd * w.f + (v.match - 3) * w.fm;

  }
  function missedContracted(D, s) {
    const t = getTier(D, s);
    return t.contracted.filter(id => { const a = D.actions.find(x => x.id === id); return a && !flag(s, a.flag); });
  }
  function satisfaction(D, s) {
    const vb = vendorBonus(D, s);
    const t = getTier(D, s);
    let couple = s.coupleScore + vb.couple + t.expect;
    let family = s.familyScore + vb.family + t.expect;
    const missed = missedContracted(D, s).length;

    Object.keys(D.budgetMin || {}).forEach(cat => { const v = vendorFor(D, s, cat); if (v && !v.fallback && v.price < D.budgetMin[cat]) { const p = 3 * (t.discountMult || 1); couple -= p; family -= p; } });
    couple -= missed * 1.5;
    family -= missed * 1.5;
    return { couple: clamp(Math.round(couple)), family: clamp(Math.round(family)) };
  }

  function discountDemand(D, s) {
    const t = getTier(D, s);
    const sat = satisfaction(D, s);
    const avg = (sat.couple + sat.family) / 2;
    let pct = (s.grievances || 0) * 2.5 * t.discountMult + missedContracted(D, s).length * 4;

  }

    const sat = satisfaction(D, s);

    const m = money(D, s);

    m.profit -= withheld;

    const total = m.profit + reputation;
    const rating = total >= 110 ? "Xuất sắc" : total >= 85 ? "Rất tốt" : total >= 60 ? "Ổn" : "Cần cải thiện";

    const ctx = canvas.getContext("2d");

    const pts = [];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {

    ctx.fillStyle = OUTLINE;
    pts.forEach(([x, y]) => ctx.fillRect(x, y, 1, 1));

  }

  // ---- Time ----------------------------------------------------------------------
  // Every agency-paid extra is listed by name in the settlement, so the player can see where the money went.
  function addExtra(label, cost) {

    log(`Team tăng ca thêm 1 lượt. Team mệt: rủi ro mọi hạng mục +3%.`, "bad");
    toast("+1 lượt · team mệt hơn", "warn");
  }

  // ---- Vendors -------------------------------------------------------------------
  function isFull(v) {
    const c = getCat(v.category);
    if (state.week <= c.deadline || state.selectedVendors[c.id] === v.id || hasSkill("moi_quan_he")) return false;
    const list = D.vendors.filter(x => x.category === c.id).sort((a, b) => hash(state.seed + a.id) - hash(state.seed + b.id));

  const isLate = c => state.week > c.deadline;
  function canBook(v) {

  }
  function book(id) {

    state.ap -= 1; state.selectedVendors[c.id] = id;
    if (isLate(c)) state.flags[`rush_${c.id}`] = true;
    log(`Chốt ${c.label.toLowerCase()}: ${v.name}${isLate(c) ? " (đặt gấp, +${Math.round(TIME.rushFee * 100)}% giá)" : ""}.`, isLate(c) ? "bad" : "good");
    visit(id);
  }
  function research(id) {
    const v = getVendor(id);
    if (state.researched[id]) return;
    if (state.ap < 1) return toast("Hết lượt tuần này", "warn");
    state.ap -= 1; state.researched[id] = true;
    log(`Tìm hiểu ${v.name}: độ tin cậy ${v.reliability}/5.`);
  }
  function negotiate(id) {
    const v = getVendor(id);
    if (state.selectedVendors[v.category] !== id || state.negotiated[id] || !v.discount) return;
    if (state.ap < 1) return toast("Hết lượt tuần này", "warn");
    state.ap -= 1; state.negotiated[id] = true;
    log(`Thương lượng với ${v.name}: giảm ${Math.round((v.discount + state.negBonus) * 100)}%.`, "good");
  }
  function setSpec(cat, sp) {
    if (!state.selectedVendors[cat]) return toast("Chốt vendor trước đã", "warn");
    state.specs[cat] = sp;
  }

  // ---- Tasks, meetings, wishes ------------------------------------------------------
  function actionBlock(a) {
    if (flag(a.flag)) return "Đã xong";
    if (state.week < a.from) return `Mở tuần ${a.from}`;
    if (state.week > a.to) return "Đã quá hạn";
    if (a.requires && !state.selectedVendors[a.requires]) return `Cần chốt ${getCat(a.requires).label.toLowerCase()} trước`;
    if (state.ap < (a.cost || 1)) return `Cần ${a.cost || 1} lượt`;
    return "";
  }
  const meetingFor = actionId => Object.entries(D.meetings).find(([, m]) => m.action === actionId);
  function doAction(id) {
    const a = getAction(id); const why = actionBlock(a);
    if (why) { state.nudge = `task:${id}`; return; }
    if (a.special === "concept") { state.sheet = { type: "concept", pick: state.selectedConcept || "modern" }; return; }
    state.ap -= a.cost || 1; state.flags[a.flag] = true;
    state.coupleScore += a.couple || 0; state.familyScore += a.family || 0;
    const meet = meetingFor(id);
    if (meet) {
      state.meeting = { key: meet[0], asked: [] }; state.sheet = { type: "meeting" };
      log(`${a.title}.`, "good");
      return;
    }
    (a.flags || []).forEach(f => { state.flags[f] = true; });
    log(`${a.title}.`, "good");
    toast(`Xong: ${a.title}`, "good");
  }
  function ask(qid) {
    const m = state.meeting; if (!m) return;
    const def = D.meetings[m.key];
    if (m.asked.length >= def.picks || m.asked.includes(qid)) return;
    const q = def.questions.find(x => x.id === qid); if (!q) return;
    m.asked.push(qid);

    const w = getWish(q.reveal);

  function wishBlock(w) {

    const old = D.concepts.find(x => x.id === state.selectedConcept);

    state.coupleScore += c.couple; state.familyScore += c.family; state.sheet = null;
    log(`${old ? "Đổi" : "Chốt"} concept ${c.name}.`, "good");
  }
  const promisedDue = () => D.actions.filter(a => isContracted(a.id) && a.to === state.week && a.from <= state.week && !flag(a.flag));
  const decisionPending = () => { const d = weekDilemma(); return !!d && !state.dilemmaPick[d.id]; };
  function nextWeek(force) {
    if (decisionPending()) { state.needDecision = true; state.sheet = null; return "decision"; }
    if (!force && promisedDue().length) { state.sheet = { type: "confirmWeek" }; return; }
    state.sheet = null;
    if (state.week >= D.config.weeks) { startEvent(); return; }
    state.week += 1; state.weekExtra = { fl: 0, ot: 0 }; state.ap = weekAP(); state.riskStart = riskStatus().hot;
    log(`Bắt đầu tuần ${state.week}.`);
  }

  // ---- Event day: each crisis is rolled when its time comes, so earlier choices change later odds ----
  function startEvent() {
    D.categories.forEach(c => {
      if (state.selectedVendors[c.id]) return;
      const cheapest = D.vendors.filter(v => v.category === c.id).sort((a, b) => a.price - b.price)[0];
      state.selectedVendors[c.id] = cheapest.id; state.flags[`fallback_${c.id}`] = true;
      log(`Không chốt ${c.label.toLowerCase()} kịp: phải đặt khẩn ${cheapest.name}.`, "bad");
    });
    state.phase = "event"; state.rolls = []; state.moments = [];
    startStage(evList()[0]);
  }
  function startStage(ev) {
    state.stage = ev; state.stageHits = 0; state.qi = 0; state.crisisOutcome = null; state.lastResolved = null;
    state.pending = D.crises.filter(c => c.event === ev).map(c => c.id);
    const q = [{ k: "intro", event: ev }];
    D.wishes.filter(w => w.event === ev).forEach(w => {
      if (w.kind === "wish" && flag(`wish_${w.id}`)) q.push({ k: "moment", event: ev, id: w.id, good: true });
      if (w.kind === "taboo" && tabooBroken(w)) q.push({ k: "moment", event: ev, id: w.id, good: false });
    });
    q.filter(x => x.k === "moment").forEach(x => {
      const w = getWish(x.id); const m = x.good ? wishMult(w.id) : 1;
      x.c = Math.round(w.couple * m); x.f = Math.round(w.family * m);
      state.coupleScore += x.c; state.familyScore += x.f; state.moments.push(x);
      state.ledger.push({ label: x.good ? `Khoảnh khắc: ${w.title}` : `Phạm điều kiêng: ${w.title}`, c: x.c, f: x.f });
    });
    state.queue = q; advanceEvent();
  }
  // Roll the next crisis of this stage straight away; when none is left, close the stage.
  function advanceEvent() {
    const item = rollNext();

    state.qi = state.queue.length - 1; state.crisisOutcome = null;
  }
  function stageNext() {
    if (state.stage === "ENGAGEMENT" && evList().includes("WEDDING")) { startStage("WEDDING"); return; }
    startSettlement();
  }
  function rollNext() {
    while (state.pending.length) {
      const id = state.pending.shift(); const c = getCrisis(id);
      const ch = E.crisisChance(D, state, c);

      state.rolls.push({ id, pct: ch.pct, happened });

    }
    return null;
  }
  function nextItem() { const cur = state.queue[state.qi]; if (cur && cur.k === "end") stageNext(); }
  function evList() { return D.project.events || ["ENGAGEMENT", "WEDDING"]; }
  const crisisCount = () => state.rolls.filter(r => r.happened).length;
  function optionBlock(o) {
    for (const r of o.requires || []) {
      if (r.flag && !flag(r.flag)) return `Cần: ${E.flagLabel(D, r.flag)}`;
      if (r.anyFlag && !r.anyFlag.some(flag)) return `Cần: ${r.anyFlag.map(f => E.flagLabel(D, f)).join(" hoặc ")}`;
      if (r.venueKind && !r.venueKind.includes(E.vendorFor(D, state, "venue")?.kind)) return "Chỉ được khi tiệc ở khách sạn";
    }
    return "";
  }
  function successChance(cr, o) {
    const kind = E.optionKind(o);
    if (kind !== "agency" && kind !== "client") return 100;
    let p = kind === "agency" ? 75 : 85;
    if (flag("backupCrew")) p += 10;
    if (hasSkill("xu_ly")) p += 10;
    const v = cr.category && E.vendorFor(D, state, cr.category);
    if (v && v.reliability >= 4) p += 10;
    p -= state.fatigue * 5;
    return clamp(p, 30, 95);
  }
  function resolveCrisis(oid) {
    const item = state.queue[state.qi]; if (!item || item.k !== "crisis" || item.out) return;
    const cr = getCrisis(item.id); const idx = cr.options.findIndex(x => x.id === oid); const o = cr.options[idx]; if (!o) return;
    const why = optionBlock(o); if (why) { state.nudge = `opt:${oid}`; return; }
    const fx = { ...(o.effects || {}) }; const kind = E.optionKind(o);
    const chance = successChance(cr, o);
    const success = chance >= 100 || roll(`opt:${item.id}:${idx}`) < chance;
    if (!success) { fx.couple = (fx.couple || 0) - 3; fx.family = (fx.family || 0) - 3; }
    let recovered = 0;
    const vendorFault = D.categories.some(c => c.id === cr.category);

    if (fx.clientPays) state.clientCharged += fx.clientPays;
    const g = E.GRIEVANCE[kind] + (success ? 0 : 1);
    state.grievances += Math.max(0, g - (hasSkill("binh_tinh") ? 0.5 : 0) - roleCount("planner") * 0.5);
    state.coupleScore += fx.couple || 0; state.familyScore += fx.family || 0;
    const tone = kind === "prep" ? "good" : kind === "absorb" ? "bad" : success ? "ok" : "fail";
    let mark = null;
    if (o.mark && !state.marks.includes(o.mark.id)) { state.marks.push(o.mark.id); mark = o.mark.text; }
    item.out = { id: o.id, kind, recovered, success, chance, tone, fx, mark };
    state.ledger.push({ label: `Sự cố: ${cr.title.toLowerCase()}`, c: fx.couple || 0, f: fx.family || 0 });
    log(`${cr.title}: ${o.title}${success ? "" : " (không thành)"}.`, tone === "good" || tone === "ok" ? "info" : "bad");

  }

  // ---- Settlement ---------------------------------------------------------------
  function startSettlement() {

    state.settlement = items; state.settlementIndex = 0; state.settlementOutcome = null;
    if (!items.length) { log("Quyết toán suôn sẻ: khách thanh toán đủ.", "good"); finish(); return; }
    state.phase = "settlement";
  }
  function settlementOptions(item) {
    const fee = E.tierFee(D, tierObj());
    const sat = E.satisfaction(D, state); const soft = (sat.couple + sat.family) / 2 >= 70;
    if (item.type === "discount") {
      const half = Math.round(item.pct / 2);
      return [
        { id: "accept", title: `Đồng ý giảm ${item.pct}%`, note: `Mất ${money(fee * item.pct / 100)}, khách thấy được tôn trọng`, feePct: item.pct, c: 3, f: 3, reply: "Cảm ơn bạn đã nhận trách nhiệm. Tụi mình sẽ giới thiệu bạn bè." },
        { id: "negotiate", title: `Thương lượng xuống ${half}%`, note: soft ? "Khách còn khá vui, dễ đồng ý" : "Khách đang bực, mặc cả lúc này dễ mất lòng", feePct: half, c: soft ? 0 : -4, f: soft ? 0 : -4, reply: soft ? "Ừ, vậy cũng được." : "Thôi được, nhưng tụi mình hơi buồn đó." },
        { id: "refuse", title: "Giữ nguyên phí", note: "Giữ đủ tiền, rủi ro bị review xấu", feePct: 0, c: -8, f: -6, reply: "Vậy là hết sự cố cũng không ai chịu sao…" }
      ];
    }

    return [
      { id: "absorb", title: `Agency chịu ${money(x)}`, note: "Mất tiền, đổi lại thiện cảm", pay: x, c: 2, f: 2, reply: "Bạn làm việc sòng phẳng ghê." },
      { id: "split", title: `Chia đôi, agency chịu ${money(x / 2)}`, note: "Hai bên cùng nhường", pay: x / 2, c: 0, f: 0, reply: "Ok, chia đôi cho công bằng." },
      { id: "insist", title: "Yêu cầu khách trả đủ", note: "Đúng hợp đồng nhưng khách khó chịu", pay: 0, c: -5, f: -4, reply: "Lỗi đâu phải của tụi mình mà…" }

  // ---- Scene ---------------------------------------------------------------------
  let scene = null, sceneKey = "";

    const v = E.vendorFor(D, state, "decor"); if (!v) return 5;

  };
  const venueKind = () => ({ hotel: "ballroom", outdoor: "garden", hybrid: "hall" }[E.vendorFor(D, state, "venue")?.kind] || "hall");
  const crisisActor = { flower_delay: "v_decor", tray_team_short: "tray0", extra_guests_engagement: "g0", ritual_conflict: "mom_groom", loadin_late: "v_venue", rental_missing: "v_rental", weather: "bride", catering_shortage: "v_catering", sound_failure: "v_mc", mc_mistake: "v_mc", photo_moment: "v_photo", overtime: "v_venue" };

  function desiredScene() {
    const p = state.phase;

    const lv = state.career ? state.career.stage : 0, office = { level: lv };

  function cast(key) {

      st("groom", { ...CL("groom_engage"), turn: 1 }, 87, 89, { mood: done === 6 ? "happy" : null });
      st("bride", { ...CL("bride_engage"), turn: -1 }, 105, 89, { mood: "happy" });
      st("mom_groom", { ...SP.PEOPLE.mom_groom, turn: 1 }, 42, 91, { mood: done === 6 ? "happy" : null });
      st("dad_groom", { ...SP.PEOPLE.dad_groom, turn: 1 }, 62, 97);
      st("mom_bride", { ...SP.PEOPLE.mom_bride, turn: -1 }, 132, 97, { mood: done === 6 ? "happy" : null });
      st("dad_bride", { ...SP.PEOPLE.dad_bride, turn: -1 }, 152, 91, { mood: "happy" });
      st("v_mc", vlook("mc"), 174, 93);
      st("v_photo", vlook("photo"), 182, 142);
      st("me", me, 18, 97, { speed: 26 });
      const BX = [[56, 119], [34, 119], [12, 119], [64, 142], [42, 142], [20, 142]], GX = [[136, 119], [158, 119], [180, 119], [124, 142], [146, 142], [166, 142]];

      });

        st(`maid${i}`, { ...look, turn: -1, carry: i < done ? SP.TRAYS[i] : null, carryDx: -1, pose: i >= done ? "reach" : null }, x, y, { mood: i < done || taking ? "happy" : null });

      s.add("me", me, 96, 96, { zone: floor, speed: 28 });

    }

  function visit(vendorId) {
    if (!scene || !sceneKey.startsWith("prep")) return;
    const look = SP.VENDOR_LOOKS[vendorId]; if (!look) return;
    const id = `visit_${vendorId}`; scene.remove(id);
    const a = scene.add(id, look, 170, 70, { still: true, speed: 30, bubble: "♥" });
    a.tx = 112; a.ty = 84;
    setTimeout(() => { if (!scene) return; const x = scene.get(id); if (x) { x.tx = 172; x.ty = 66; x.exitAfter = true; x.bubble = null; } }, 2600);
  }
  // a crisis whose actor is not in the current scene falls back to the planner
  const onStage = id => (scene && scene.get(id) ? id : "me");
  function syncScene() {
    const host = $("#stage canvas"); if (!host) return;
    if (!scene || scene.canvas !== host) { scene = new SC.Scene(host); sceneKey = ""; }
    const want = desiredScene();
    if (want.key !== sceneKey) { scene.set(want.kind, want.opts || {}); sceneKey = want.key; cast(want.key); }

    const p = state.phase;

    if (p === "brief") scene.bubble(state.briefStep % 2 ? "groom" : "bride", "…");
    if (p === "prep" && state.sheet?.type === "meeting") scene.bubble("me", "…");

    if (p === "event") {
      const item = state.queue[state.qi];
      Object.values(crisisActor).forEach(id => scene.release(id)); D.crises.forEach(c => c.actor && scene.release(c.actor)); scene.release("me");
      const last = state.queue[state.lastResolved];

        const t = last.out.tone; scene.bubble(onStage(crisisActor[last.id] || getCrisis(last.id).actor), t === "good" ? "♥" : t === "ok" ? "✓" : "…", t === "good" || t === "ok" ? "happy" : "upset");
      }
      if (item?.k === "crisis") {
        const actor = onStage(crisisActor[item.id] || getCrisis(item.id).actor); const me = scene.get("me");
        if (item.id === "weather") scene.rain = true;

        if (me && actor !== "me" && scene.get(actor)) { scene.moveTo(actor, me.x + 12, me.y); scene.moveTo("me", me.x, me.y); }
      } else if (item?.k === "end") { const ok = state.stageHits === 0; scene.bubble("bride", ok ? "♥" : "…"); scene.bubble("groom", "♥"); }
    }
  }

  // ---- v3.5.1: story first. Numbers stay in the engine; people and consequences are what the player reads. ----
  const COPY = window.WP_COPY;

  const moodLine = (who, score) => COPY.mood[who][moodBand(score)];
  function shiftLine(who, delta) {

  function weekPhase(w, W) {

    }

    const btns = w.cost

         <button class="mini primary" data-act="wish" data-id="${w.id}:gift" ${why ? "disabled" : ""}><b>Agency tặng</b><small>Chi ${money(w.cost)} · khách vui +${joy}, bớt đòi giảm phí</small></button></div>`
      : `<button class="mini primary" data-act="wish" data-id="${w.id}:free" ${why ? "disabled" : ""}>Đưa vào kế hoạch · miễn phí · khách vui +${joy}</button>`;
    return `<div class="wish ${done ? "done" : ""}"><div><b>${done ? "✓" : "♥"} ${esc(w.title)}</b><small>${esc(w.detail)}</small><small>Tốn 1 lượt.</small></div>
      ${done ? `<span class="pos">Đã có trong kế hoạch${state.wishMode[w.id] === "client" ? " · khách trả" : state.wishMode[w.id] === "gift" ? " · agency tặng" : ""}</span>` : `${btns}${why ? `<em>${esc(why)}</em>` : ""}`}</div>`;
  }


  function crisisOptions(cr) {
    return `<div class="list">${cr.options.map(o => { const why = optionBlock(o); const ch = successChance(cr, o); return `<button class="opt ${why ? "locked" : ""}" data-act="opt" data-id="${o.id}" ${why ? 'aria-disabled="true"' : ""}><b>${esc(o.title)}</b><div class="chips">${effectChips(o.effects || {}, (D.reactions[cr.id] || {}).who)}${why ? "" : ch < 100 ? `<span class="${ch < 65 ? "neg" : ""}">${ch >= 85 ? "Chắc ăn" : ch >= 65 ? "Khá chắc" : "Hên xui"} ${ch}%</span>` : `<span class="pos">Chắc chắn</span>`}${o.mark ? `<span class="gold">Có hệ quả về sau</span>` : ""}</div>${why ? `<em>${esc(why)}</em>` : ""}</button>`; }).join("")}</div>`;
  }
  function crisisDone(item, n) {
    const cr = getCrisis(item.id); const out = item.out; const chosen = cr.options.find(o => o.id === out.id);
    const re = D.reactions[cr.id]; const reWho = re ? re.who : "bride";
    const toneLabel = { good: "Ổn thỏa nhờ chuẩn bị", ok: "Xử lý được", fail: "Không thành", bad: "Chịu thiệt" }[out.tone];
    // The newest resolved incident stays open; older ones fold into one line each.
    const fresh = state.lastResolved != null && state.queue[state.lastResolved] === item;
    return `<details class="card ev-item ev-done outcome ${out.tone}" ${fresh ? "open" : ""}><summary><span class="ev-sum"><span class="eyebrow">${esc(cr.time)} · Sự cố ${n}</span><b>${esc(cr.title)}</b></span><span class="small ${out.tone === "ok" || out.tone === "good" ? "pos" : "neg"}">${toneLabel}</span></summary>
      <p><span class="muted">Bạn chọn:</span> ${esc(chosen.title)}. ${esc(out.success ? chosen.why : (re?.fail || "Không kịp xử lý như mong muốn."))}</p>
      ${re ? `<div class="msg solo">${img(speakerLook(reWho), "face")}<p>${esc(out.tone === "fail" ? re.bad : re[out.tone])}</p></div>` : ""}
      <div class="chips">${effectChips(out.fx, reWho)}${out.recovered ? `<span class="pos">Đòi lại vendor ${money(out.recovered)}</span>` : ""}</div>
      ${out.mark ? `<p class="mark">Hệ quả: ${esc(out.mark)}</p>` : ""}</details>`;
  }
  function screenEvent() {
    const ev = state.stage; const wed = ev === "WEDDING";
    const evName = wed ? "Tiệc cưới" : "Lễ ăn hỏi";
    const venueName = wed ? (E.vendorFor(D, state, "venue")?.name || "") : "Nhà gái";
    let n = 0;
    const feed = state.queue.map((item, i) => {
      if (item.k === "intro") {
        const moments = state.queue.filter(x => x.k === "moment").length;
        return `<div class="ev-head"><span class="eyebrow">${wed ? "17:00" : "07:00"} · ${esc(venueName)}</span><h2 class="h big">${evName}</h2><p class="muted">Sự cố được tung xúc xắc đúng lúc nó tới, nên cách bạn xử lý cái trước ảnh hưởng cái sau.${moments ? ` ${moments} khoảnh khắc từ quá trình chuẩn bị.` : ""}</p></div>`;
      }
      if (item.k === "moment") {
        const w = getWish(item.id);
        return `<div class="card ev-item moment ${item.good ? "" : "bad"}"><span class="eyebrow">${item.good ? "Khoảnh khắc đặc biệt" : "Phạm điều khách kiêng"}</span><b>${esc(w.title)}</b>
          <div class="msg solo">${img(speakerLook(momentActor(w)), "face")}<p>${esc(w.moment)}</p></div><div class="chips">${effectChips({ couple: item.c ?? w.couple, family: item.f ?? w.family }, momentActor(w))}</div></div>`;
      }
      if (item.k === "crisis") {

        if (item.out) return crisisDone(item, n);
        const cr = getCrisis(item.id);
        return `<div class="card crisis ev-item" id="ev-cur"><div class="chips"><span>${esc(cr.time)}</span><span class="${item.pct >= 40 ? "neg" : ""}">Xác suất ${item.pct}%</span><span>Sự cố ${n}</span></div>
          <h2 class="h big">${esc(cr.title)}</h2><p>${esc(cr.baseDescription)}</p>
          <details class="why"><summary>Vì sao ${item.pct}%?</summary><ul>${item.reasons.map(r => `<li>${esc(r.text)} <b>${r.value > 0 ? "+" : ""}${r.value}%</b></li>`).join("")}</ul></details>
          <div class="row-between"><b class="ask">Bạn xử lý thế nào?</b>${numsLink()}</div>${crisisOptions(cr)}</div>`;
      }
      if (item.k === "end") {
        const hits = state.stageHits; const last = ev === "ENGAGEMENT" && evList().includes("WEDDING");
        return `<div class="card ev-end" id="ev-cur"><h2 class="h">${hits ? `Xong ${evName.toLowerCase()} · ${hits} sự cố` : `${evName} suôn sẻ`}</h2><p class="muted">${hits ? "Hậu quả các lựa chọn sẽ tính vào quyết toán." : "Không có sự cố nào. Mọi người vui vẻ."}</p>
          <button class="btn primary" data-act="stageNext">${last ? "Sang tiệc cưới" : "Quyết toán"}</button></div>`;
      }
      return "";
    }).join("");
    return `<section class="stack ev-feed">${feed}</section>`;
  }

  function screenSettlement() {
    const item = state.settlement[state.settlementIndex]; if (!item) return "";
    const fee = E.tierFee(D, tierObj()); const missed = E.missedContracted(D, state);
    const ask = item.type === "discount"
      ? `Hôm đó có ${crisisCount()} sự cố${missed.length ? `, và có ${missed.length} việc anh chị cam kết mà không làm` : ""}. Tụi em xin giảm ${item.pct}% phí planning (${money(fee * item.pct / 100)}) nha.`
      : `Khoản phát sinh ${money(item.amount)} hôm cưới là lỗi bên vendor mà, tụi em không muốn trả đâu.`;
    const o = state.settlementOutcome;
    return `<section class="stack">
      <div class="chat"><div class="msg bride">${img(CL("bride_casual"), "face")}<p>${esc(ask)}</p></div>
      ${o ? `<div class="msg me">${img(planner().look, "face")}<p>${esc(o.title)}.</p></div><div class="msg bride">${img(CL("bride_casual"), "face")}<p>${esc(o.reply)}</p></div>` : ""}</div>
      ${missed.length && item.type === "discount" ? `<details class="why"><summary>Việc cam kết đã bỏ</summary><ul>${missed.map(id => `<li>${esc(getAction(id).title)}</li>`).join("")}</ul></details>` : ""}
      ${o ? `<button class="btn primary" data-act="nextSettle">${state.settlementIndex >= state.settlement.length - 1 ? "Xem tổng kết" : "Tiếp"}</button>`
        : `<div class="list">${settlementOptions(item).map(x => `<button class="opt" data-act="settle" data-id="${x.id}"><b>${esc(x.title)}</b><small>${esc(x.note)}</small></button>`).join("")}</div>`}
    </section>`;
  }

  function lessons(r) {
    const out = [];
    if (r.withheld) out.push(`Khách quá thất vọng nên giữ lại ${money(r.withheld)} đợt thanh toán cuối.`);
    const missedWishes = D.wishes.filter(w => w.kind === "wish" && state.revealed.includes(w.id) && !flag(`wish_${w.id}`));
    if (missedWishes.length) out.push(`Biết khách muốn ${missedWishes.map(w => w.title.toLowerCase()).join(", ")} mà chưa làm.`);
    const unknown = D.wishes.filter(w => w.kind === "wish" && !state.revealed.includes(w.id)).length;
    if (unknown >= 4) out.push(`Còn ${unknown} mong muốn của khách bạn chưa từng hỏi ra. Đám sau thử hỏi câu khác.`);
    const cheap = D.categories.filter(c => (state.specs[c.id] || "full") === "cheap" && !flag(`fallback_${c.id}`)).map(c => c.label.toLowerCase());
    if (cheap.length) out.push(`Ép giá ở ${cheap.join(", ")}: lời thêm nhưng rủi ro và chất lượng ở đó đi xuống.`);
    if (state.marks.length) out.push("Có quyết định ở lễ ăn hỏi kéo theo rắc rối ở tiệc cưới.");
    if (r.missed?.length) out.push(`${r.missed.length} việc cam kết bị bỏ, khách lấy đó làm lý do đòi giảm phí.`);
    const lucky = state.rolls.filter(x => !x.happened && x.pct >= 35);
    if (lucky.length) out.push(`May mắn: ${lucky.map(x => getCrisis(x.id).title.toLowerCase()).join(", ")} có xác suất cao mà không xảy ra.`);
    if (!out.length) out.push("Dự án cân bằng tốt. Khách cũ sẽ giới thiệu thêm khách mới.");
    return out.slice(0, 5);
  }
  function careerAfter(r) {
    const c = state.career, o = state.project; const months = o.months; const burn = monthlyCost() * months;
    const after = c.cash + r.profit - burn;
    return `<div class="career-stats">
      <div><small>Lời đám này</small><b class="${r.profit < 0 ? "neg" : ""}">${money(r.profit)}</b></div>
      <div><small>Lương + VP ${months} tháng</small><b class="${burn ? "neg" : ""}">${burn ? "−" + money(burn) : "0tr"}</b></div>
      <div><small>Quỹ sau đám</small><b class="${after < 0 ? "neg" : ""}">${money(after)}</b></div></div>`;
  }
  // Break the final satisfaction down into the decisions that produced it.
  function decisionLog() {
    const out = [];
    const q = state.project.quote; if (q) out.push(`Gói planning: ${{ low: "Cơ bản", mid: "Tiêu chuẩn", high: "Toàn diện" }[q.level]} · ${money(state.project.fee)}`);
    if (state.project.type !== "dayof") D.categories.forEach(c => { const v = E.vendorFor(D, state, c.id); if (v) out.push(`${c.label}: ${flag(`fallback_${c.id}`) ? "đặt khẩn" : TIER_NAMES[D.vendorTier[v.id]]} · ${v.name}${flag(`rush_${c.id}`) ? " (chốt trễ)" : ""}`); });
    const concept = D.concepts.find(c => c.id === state.selectedConcept); if (concept && state.project.type !== "dayof") out.push(`Concept: ${concept.name}`);
    Object.entries(state.dilemmaPick).forEach(([id, opt]) => { const d = C.DILEMMAS.find(x => x.id === id); const o = d && d.options.find(x => x.id === opt); if (o) out.push(`${d.title}: ${o.label}`); });
    Object.entries(state.wishMode).forEach(([id, m]) => { const w = getWish(id); if (w) out.push(`${w.title}: ${m === "client" ? "khách trả" : m === "gift" ? "agency tặng" : "miễn phí"}`); });
    state.queue.filter(x => x.k === "crisis" && x.out).forEach(x => { const cr = getCrisis(x.id); out.push(`${cr.title}: ${cr.options.find(o => o.id === x.out.id).title}`); });
    if (state.settlementOutcome) out.push(`Quyết toán: ${state.settlementOutcome.title}`);
    return out;
  }
  function satReasons() {
    const t = tierObj(); const vb = E.vendorBonus(D, state); const avg = (c, f) => (c + f) / 2;
    const out = [];
    out.push({ t: "Chất lượng vendor", v: avg(vb.couple, vb.family) });
    if (t.expect) out.push({ t: t.expect < 0 ? "Khách kỳ vọng cao (loại đám, gói, tính cách)" : "Khách dễ tính", v: t.expect });
    const missed = E.missedContracted(D, state).length; if (missed) out.push({ t: `Bỏ ${missed} việc đã hứa`, v: -1.5 * missed });
    const below = Object.keys(D.budgetMin || {}).filter(cat => { const v = E.vendorFor(D, state, cat); return v && !v.fallback && v.price < D.budgetMin[cat]; }).length;
    if (below) out.push({ t: `${below} hạng mục vendor dưới range, khách chê rẻ`, v: -below * 3 * (t.discountMult || 1) });
    const led = state.ledger.reduce((s, x) => s + avg(x.c, x.f), 0);
    state.ledger.forEach(x => out.push({ t: x.label, v: avg(x.c, x.f) }));
    const prep = avg(state.coupleScore, state.familyScore) - CFG.startScore - led;
    if (Math.abs(prep) >= 1) out.push({ t: "Chuẩn bị: gặp khách, concept, các việc đã làm", v: prep });
    return out.filter(x => Math.abs(x.v) >= 1).sort((a, b) => Math.abs(b.v) - Math.abs(a.v)).slice(0, 7);
  }
  function screenReview() {
    const r = state.result;
    const quote = r.stars >= 5 ? "Hoàn hảo! Tụi em sẽ giới thiệu anh chị cho cả nhóm bạn." : r.stars === 4 ? "Đám cưới rất đẹp, có chút trục trặc nhưng xử lý ổn." : r.stars === 3 ? "Cũng được, nhưng tụi em kỳ vọng nhiều hơn." : r.stars === 2 ? "Nhiều chuyện không như đã hứa. Tụi em khá thất vọng." : "Tệ thật sự. Tụi em sẽ review cho mọi người biết.";
    const rows = [
      ["Chênh lệch dự toán − vendor", r.margin], ["Phí planning", r.fee], r.feeDiscount ? ["Khách đòi giảm phí", -r.feeDiscount] : null,
      r.staffCost + r.travel ? [r.staffCost ? "Lương team" + (r.travel ? " + công tác" : "") : "Đi lại, lưu trú cho team", -(r.staffCost + r.travel)] : null, ...(state.extras?.length ? extraRows() : r.extraCost ? [["Freelancer + mong muốn khách", -r.extraCost]] : []),
      r.crisisCost ? ["Chi xử lý sự cố", -r.crisisCost] : null, r.recovered ? ["Đòi lại từ vendor", r.recovered] : null,
      r.disputePaid ? ["Gánh phát sinh khách không trả", -r.disputePaid] : null, r.withheld ? ["Khách giữ lại thanh toán", -r.withheld] : null
    ].filter(Boolean);
    const good = state.moments.filter(m => m.good);
    return `<section class="stack">
      <div class="card center"><span class="eyebrow">${["", "Thất bại", "Chưa ổn", "Ổn", "Rất tốt", "Xuất sắc"][r.stars]}</span><div class="stars-big" aria-label="${r.stars} sao">${"★".repeat(r.stars)}<i>${"★".repeat(5 - r.stars)}</i></div>
        <div class="msg bride solo">${img(CL("bride"), "face")}<p>${esc(quote)}</p></div></div>
      ${careerAfter(r)}
      <div class="card"><h2 class="h">Vì sao được ${r.stars}★</h2><p class="muted">Điểm hài lòng trung bình ${Math.round((r.couple + r.family) / 2)}/100, bắt đầu từ ${CFG.startScore}. Từ 86 là 5★, 74 là 4★, 62 là 3★.</p>
        <ul class="reasons">${satReasons().map(x => `<li class="${x.v >= 0 ? "pos" : "neg"}"><b>${x.v >= 0 ? "+" : "−"}${Math.round(Math.abs(x.v))}</b><span>${esc(x.t)}</span></li>`).join("")}</ul></div>
      <div class="card"><div class="row-between"><span>Cặp đôi</span><b>${r.couple}/100</b></div><div class="bar"><i style="width:${r.couple}%"></i></div>
        <div class="row-between"><span>Hai họ</span><b>${r.family}/100</b></div><div class="bar"><i style="width:${r.family}%"></i></div></div>
      <div class="card"><h2 class="h">Sau đám cưới</h2><div class="people">${[["bride", r.couple], ["groom", r.couple], ["mom_bride", r.family], ["mom_groom", r.family]].map(([who, s]) => `<div class="person">${img(speakerLook(who), "face", bandMood(s))}<p>${esc(moodLine(who, s))}</p></div>`).join("")}</div></div>
      ${good.length ? `<div class="card"><h2 class="h">Khoảnh khắc đáng nhớ</h2><ul class="bul">${good.map(m => `<li>${esc(getWish(m.id).title)}</li>`).join("")}</ul></div>` : ""}
      <details class="card" open><summary class="h">Quyết toán</summary><dl class="rows">${rows.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd class="${v < 0 ? "neg" : ""}">${signed(v)}</dd></div>`).join("")}<div class="sum"><dt>Lợi nhuận</dt><dd>${money(r.profit)}</dd></div></dl></details>
      <div class="card"><h2 class="h">Nhìn lại</h2><ul class="bul">${lessons(r).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
      <details class="card"><summary class="h">Các quyết định của bạn</summary><ul class="bul">${decisionLog().map(x => `<li>${esc(x)}</li>`).join("")}</ul></details>
      <details class="card"><summary class="h">Rủi ro đã đối mặt</summary><div class="risks">${state.rolls.filter(x => x.pct > 0).sort((a, b) => b.pct - a.pct).map(x => `<div class="risk"><span>${esc(getCrisis(x.id).title)}</span><b class="${x.happened ? "neg" : "pos"}">${x.pct}% · ${x.happened ? "xảy ra" : "thoát"}</b></div>`).join("")}</div></details>
      <button class="btn primary" data-act="toOffice">Về văn phòng</button>
    </section>`;
  }

  // ---- Sheets ----------------------------------------------------------------------

  function sheetMeeting() {
    const m = state.meeting; const def = D.meetings[m.key]; const left = def.picks - m.asked.length;
    const asked = m.asked.map(id => def.questions.find(q => q.id === id));
    const unlocked = asked.map(q => getWish(q.reveal)).filter(Boolean);
    return `<h2 class="h">Gặp riêng · ${esc(def.who)}</h2>
      <div class="chat">${asked.map(q => `<div class="msg me">${img(planner().look, "face")}<p>${esc(q.q)}</p></div><div class="msg ${q.speaker === "groom" ? "groom-l" : ""}">${img(speakerLook(q.speaker), "face")}<p>${esc(q.a)}</p></div>${getWish(q.reveal) ? `<div class="unlock ${getWish(q.reveal).kind}">${getWish(q.reveal).kind === "taboo" ? "⚠ Điều kiêng" : getWish(q.reveal).kind === "info" ? "★ Mở brief ẩn" : "♥ Mong muốn mới"}: ${esc(getWish(q.reveal).title)}</div>` : ""}`).join("")}</div>
      ${left > 0 ? `<p class="muted">Còn ${left} câu hỏi. Chọn câu bạn nghĩ sẽ mở ra điều quan trọng nhất.</p><div class="list">${def.questions.filter(q => !m.asked.includes(q.id)).map(q => `<button class="opt" data-act="ask" data-id="${q.id}"><b>${esc(q.q)}</b></button>`).join("")}</div>`
        : `<div class="card"><b>Buổi gặp kết thúc</b><p class="muted">${unlocked.filter(w => w.kind === "wish").length ? "Mong muốn mới đã vào tab Khách. Đưa vào kế hoạch thì ngày cưới sẽ có khoảnh khắc đặc biệt." : "Lần này chưa mở được mong muốn nào."}</p></div>
        <div class="sheet-actions"><button class="btn primary" data-act="meetDone">Xong</button></div>`}`;

  function sheetConcept() {

    const changing = !!state.selectedConcept;
    return `<h2 class="h">${changing ? "Đổi concept" : "Chọn concept"}</h2><div class="list">${D.concepts.map(c => `<button class="opt ${pick === c.id ? "on" : ""}" data-act="conceptPick" data-id="${c.id}"><b>${esc(c.name)}</b><small>${esc(c.description)}</small><div class="chips">${c.tags.map(t => `<span>${esc(t)}</span>`).join("")}</div></button>`).join("")}</div>
      <div class="sheet-actions"><button class="btn primary" data-act="conceptOk" ${changing && pick === state.selectedConcept ? "disabled" : ""}>${changing ? "Đổi" : "Chốt"} concept · 1 lượt</button></div>`;
  }
  function sheetTime() {
    const t = tierObj();
    return `<h2 class="h">Lượt là gì?</h2>
      <p>Mỗi lượt là một buổi làm việc của team: gặp khách, chốt vendor, đi khảo sát. Bạn có ${TIME.planner} lượt, mỗi nhân viên thêm ${TIME.perStaff}. Team bạn có ${t.team} người nên mỗi tuần được ${baseAP()} lượt. Lượt không dùng sẽ mất khi sang tuần.</p>
      ${timeCard()}<small class="muted">Tối đa ${TIME.freelancer.maxPerWeek} freelancer mỗi tuần.</small>`;
  }
  function sheetMoney() {
    const m = moneyNow();
    const rows = [["Dự toán khách duyệt", E.clientBudget(D)], ["Chi vendor thật", -D.categories.reduce((s, c) => s + (state.selectedVendors[c.id] ? E.vendorCost(D, state, c.id) : 0), 0)], ["Phí planning", m.feeKept]];
    if (m.staffCost + m.travel) rows.push([m.staffCost ? "Lương team" + (m.travel ? " + công tác" : "") : "Đi lại, lưu trú cho team", -(m.staffCost + m.travel)]);
    if (m.extraCost) rows.push(...(state.extras?.length ? extraRows() : [["Freelancer, mong muốn khách", -m.extraCost]]));
    if (m.crisisCost) rows.push(["Xử lý sự cố", -(m.crisisCost - m.recovered)]);
    return `<h2 class="h">Tiền lời tính thế nào</h2>
      <p class="muted">Khách trả theo dự toán, bạn trả vendor theo giá thật. Phần chênh cộng phí planning, trừ chi phát sinh, là lời của đám này. Lương nhân viên và văn phòng trừ theo tháng ở văn phòng.</p>
      <dl class="rows">${rows.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd class="${v < 0 ? "neg" : ""}">${k === "Dự toán khách duyệt" ? money(v) : signed(v)}</dd></div>`).join("")}<div class="sum"><dt>Lời dự kiến</dt><dd>${money(m.profit)}</dd></div></dl>`;
  }
  function sheetRisk() {
    const rs = riskStatus();
    const row = r => { const [lc, lt] = level(r.pct); const top = [...E.crisisChance(D, state, r.c).reasons].sort((a, b) => b.value - a.value)[0]; return `<div class="risk-row"><div><b>${esc(r.c.title)}</b><small class="muted">${esc(COPY.risk[r.c.id] || (top ? top.text : ""))}</small>${top && r.pct ? `<small class="muted">Lý do chính: ${esc(top.text)}</small>` : ""}</div><span class="pill ${lc}">${lt} ${r.pct}%</span></div>`; };
    const hot = rs.rows.filter(r => r.ok && r.pct >= 20).sort((a, b) => b.pct - a.pct), low = rs.rows.filter(r => r.ok && r.pct < 20), wait = rs.rows.filter(r => !r.ok);
    return `<h2 class="h">${hot.length} nguy cơ cần chú ý</h2>
      <p class="muted">Chỉ tính những gì đã quyết. Vendor kém tin cậy, đặt gấp và việc bỏ qua làm nguy cơ tăng; chuẩn bị đúng việc làm nó giảm.</p>
      ${hot.length ? `<h3 class="sub">Đáng lo (${hot.length})</h3><div class="list">${hot.map(row).join("")}</div>` : `<p class="pos">Chưa có nguy cơ đáng lo.</p>`}
      ${low.length ? `<h3 class="sub">Thấp (${low.length})</h3><div class="list">${low.map(row).join("")}</div>` : ""}
      ${wait.length ? `<h3 class="sub">Chưa tính vì chưa chốt vendor (${wait.length})</h3><p class="muted">${esc(wait.map(r => r.c.title).join(", "))}</p>` : ""}`;
  }
  function sheetContract() {
    const t = tierObj();
    return `<h2 class="h">${esc(t.name)} · cam kết ${t.contracted.length} việc</h2><p class="muted">Việc đã cam kết mà bỏ, lúc quyết toán khách sẽ đòi giảm phí.</p>
      <ul class="checks">${t.contracted.map(id => { const a = getAction(id); return `<li class="${flag(a.flag) ? "ok" : ""}">${flag(a.flag) ? "✓" : "○"} ${esc(a.title)} <small>tuần ${a.from}–${a.to}</small></li>`; }).join("")}</ul>`;
  }

  function sheetMenu() {
    return `<h2 class="h">Menu</h2><div class="list">
      <button class="opt" data-act="showLog"><b>Nhật ký dự án</b><small>${state.log.length} mục</small></button>
      <button class="opt" data-act="askRestart"><b>Bắt đầu sự nghiệp mới</b><small>Xóa toàn bộ tiến trình</small></button></div>`;
  }
  function sheetBody() {
    const s = state.sheet; if (!s) return "";
    if (s.type === "concept") return sheetConcept();
    if (s.type === "meeting") return state.meeting ? sheetMeeting() : "";
    if (s.type === "time") return sheetTime();
    if (s.type === "money") return sheetMoney();
    if (s.type === "risk") return sheetRisk();
    if (s.type === "contract") return sheetContract();
    if (s.type === "menu") return sheetMenu();
    if (s.type === "brand") return sheetBrand();
    if (s.type === "skill") return sheetSkill();
    if (s.type === "quote") return sheetQuote();
    if (s.type === "offer") return sheetOffer();
    if (s.type === "fire") { const x = state.career.staff.find(y => y.id === s.id); return x ? `<h2 class="h">Cho ${esc(x.name)} nghỉ?</h2><p>Bớt lương mỗi tháng, nhưng mất 1 lượt mỗi tuần và có thể tụt dưới yêu cầu nhân sự của cấp hiện tại.</p><div class="sheet-actions"><button class="btn primary" data-act="fire" data-id="${x.id}">Cho nghỉ</button><button class="btn" data-act="close">Thôi</button></div>` : ""; }
    if (s.type === "log") return `<h2 class="h">Nhật ký</h2><ol class="log">${state.log.map(l => `<li class="${l.type}">${l.week ? `<small>T${l.week}</small>` : ""}${esc(l.text)}</li>`).join("") || "<li>Chưa có gì.</li>"}</ol>`;
    if (s.type === "restart") return `<h2 class="h">Bắt đầu lại từ đầu?</h2><p>Quỹ, team và các đám đã làm sẽ mất hết.</p><div class="sheet-actions"><button class="btn primary" data-act="restartNow">Chơi lại</button><button class="btn" data-act="close">Thôi</button></div>`;
    if (s.type === "book") return sheetBook();
    if (s.type === "confirmWeek") return `<h2 class="h">Bạn còn lời hứa chưa làm</h2><p>Bạn đã hứa ${esc(promisedDue().map(a => a.title.toLowerCase()).join(", "))} trong tuần này. Bỏ qua thì lúc quyết toán khách sẽ nhắc lại và đòi giảm phí.</p><div class="sheet-actions"><button class="btn" data-act="weekForce">${state.week >= D.config.weeks ? "Vẫn vào ngày cưới" : `Vẫn sang tuần ${state.week + 1}`}</button><button class="btn primary" data-act="close">Ở lại làm</button></div>`;
    return "";
  }

  // ---- Layout and render ---------------------------------------------------------
  function navBar() {
    if (state.phase !== "prep") return "";
    const last = state.week >= D.config.weeks;
    if (decisionPending()) return `<nav class="nav"><div class="nav-in"><button class="btn next" data-act="week">Chọn quyết định tuần này trước <span class="muted-on">↑</span></button></div></nav>`;
    return `<nav class="nav"><div class="nav-in"><button class="btn primary next" data-act="week">${last ? "Vào ngày cưới" : `Sang tuần ${state.week + 1}`} </button></div></nav>`;
  }

  function render() {
    save();
    const app = $("#app");
    if (!$("#stage")) {
      app.innerHTML = `<div id="hud"></div><div id="stage" class="stage"><canvas aria-label="Cảnh trong game"></canvas></div><main id="main" class="main"></main><div id="nav"></div><div id="sheet"></div><div id="toast" class="toast" role="status" hidden></div>`;
    }
    $("#hud").innerHTML = hud();
    const p = state.phase;
    $("#main").innerHTML = p === "title" ? screenTitle() : p === "setup" ? screenSetup() : p === "hub" ? screenHub() : p === "brief" ? screenBrief() : p === "quote" ? screenQuote() : p === "prep" ? screenPrep() : p === "event" ? screenEvent() : p === "settlement" ? screenSettlement() : screenReview();
    $("#main").classList.toggle("with-nav", p === "prep");
    $("#nav").innerHTML = navBar();
    const sb = sheetBody();
    const meetingOpen = state.sheet?.type === "meeting" && state.meeting && D.meetings[state.meeting.key].picks > state.meeting.asked.length;
    $("#sheet").innerHTML = sb ? `<div class="backdrop" ${meetingOpen ? "" : 'data-act="close"'}></div><div class="sheet" role="dialog" aria-modal="true">${meetingOpen ? "" : `<button class="sheet-x" data-act="close" aria-label="Đóng">×</button>`}${sb}</div>` : "";
    $("#stage").classList.toggle("pinned", p === "setup"); // tạo nhân vật: cảnh văn phòng đứng yên, chỉ danh sách bên dưới cuộn
    $("#stage").classList.toggle("compact", ["hub", "brief", "quote", "prep", "settlement"].includes(p));
    syncScene();
  }

  const scrollTop = () => window.scrollTo({ top: 0 });
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
    const act = b.dataset.act, id = b.dataset.id;
    let top = false, scrollTo = null;
    switch (act) {
      case "newGame": state.phase = "setup"; state.setup = { step: 0, look: 0, name: "", skill: null, month: null, city: null }; top = true; break;
      case "setupLook": state.setup.look = Number(id); break;
      case "setupSkill": state.setup.skill = id; break;
      case "setupMonth": state.setup.month = Number(id); break;
      case "setupCity": state.setup.city = id; break;
      case "setupNext": if (setupReady()) state.setup.step += 1; top = true; break;
      case "setupBack": state.setup.step = Math.max(0, state.setup.step - 1); top = true; break;
      case "startCareer": if (setupReady()) startCareer(); top = true; break;
      case "learnSkill": learnSkill(id); break;
      case "briefNext": state.briefStep += 1; break;
      case "toQuote": state.phase = "quote"; top = true; break;
      case "startPrep": startPrep(); top = true; break;
      case "takeOffer": takeOffer(id); top = true; break;
      case "toOffice": endProject(); top = true; break;
      case "upgrade": upgrade(); break;
      case "floorJob": floorJob(); top = true; break;
      case "loan": takeLoan(); break;
      case "hireStaff": hire(id); break;
      case "askFire": state.sheet = { type: "fire", id }; break;
      case "fire": fire(id); state.sheet = null; break;
      case "brand": chooseBrand(id); top = true; break;
      case "endSeen": state.career.endSeen = true; break;
      case "tier": chooseTier(id); top = true; break;
      case "tab": state.tab = id; state.sheet = null; top = true; break;
      case "goVendor": state.tab = "vendors"; state.vcat = id; state.sheet = null; top = true; break;
      case "vcat": state.vcat = id; break;
      case "vendor": state.sheet = { type: "vendor", id }; break;
      case "book": book(id); state.expand = null; if (state.sheet?.type !== "book") state.sheet = null; break;
      case "vtab": { const [c, i] = id.split(":"); state.vtab[c] = Number(i); break; }
      case "nums": state.showNums = !state.showNums; break;
      case "research": research(id); break;
      case "negotiate": negotiate(id); break;
      case "spec": { const [c, sp] = id.split(":"); setSpec(c, sp); break; }
      case "task": doAction(id); break;
      case "ask": ask(id); break;
      case "meetDone": state.sheet = null; state.meeting = null; break;
      case "sheet": state.sheet = /^(quote|offer):/.test(id) ? { type: id.split(":")[0], id: Number(id.split(":")[1]) } : { type: id }; clearTimeout(toastTimer); { const t = $("#toast"); if (t) { t.hidden = true; t.className = "toast"; } } break;
      case "expand": state.expand = state.expand === id ? null : id; break;
      case "wish": fulfil(id); break;
      case "changeConcept": state.sheet = { type: "concept", pick: state.selectedConcept }; break;
      case "conceptPick": state.sheet.pick = id; break;
      case "conceptOk": confirmConcept(state.sheet.pick); break;
      case "hire": hireFreelancer(); break;
      case "overtime": overtime(); break;
      case "timeInfo": state.sheet = { type: "time" }; break;
      case "week": if (nextWeek(false) === "decision") { scrollTo = "#decision"; } else top = !state.sheet; break;
      case "weekForce": nextWeek(true); top = true; break;
      case "opt": resolveCrisis(id); break;
      case "next": nextItem(); top = true; break;
      case "stageNext": stageNext(); top = true; break;
      case "dilemma": chooseDilemma(id); break;
      case "grp": state.groups[id] = b.getAttribute("aria-expanded") !== "true"; break;
      case "settle": resolveSettlement(id); break;
      case "nextSettle": nextSettlement(); top = true; break;
      case "menu": state.sheet = { type: "menu" }; break;
      case "showLog": state.sheet = { type: "log" }; break;
      case "askRestart": state.sheet = { type: "restart" }; break;
      case "restartNow": state = fresh(); sceneKey = ""; top = true; break;
      case "close": if (state.sheet?.type === "meeting") state.meeting = null; state.sheet = null; break;
      default: return;
    }
    if (top) { clearTimeout(toastTimer); const t = $("#toast"); if (t) { t.hidden = true; t.className = "toast"; } }
    render();
    if (top) scrollTop();
    if (act === "opt") scrollTo = "#ev-cur";
    if (scrollTo) { const el = $(scrollTo); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }
    if (state.nudge) { const [k, v] = state.nudge.split(":"); state.nudge = null; const el = document.querySelector(`[data-act="${k}"][data-id^="${v}"]`); if (el) { const card = el.closest(".wish") || el; card.classList.add("nudge"); setTimeout(() => card.classList.remove("nudge"), 600); } }
  });
  document.addEventListener("input", e => {
    if (e.target.id !== "me-name") return;
    state.setup.name = e.target.value; save();
    const b = $("#setup-next"); if (b) b.disabled = !setupReady();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.id === "me-name" && setupReady()) { e.preventDefault(); state.setup.step = 1; render(); scrollTop(); return; } if (e.key === "Escape" && state.sheet && state.sheet.type !== "meeting") { state.sheet = null; render(); } });

  window.WP_GAME = { get state() { return state; }, get D() { return D; }, render, _build: buildProject };
  render();
})();

</script>
<script>
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
</body>
</html>
